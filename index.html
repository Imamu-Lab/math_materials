<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>数学教材ポータル | Imamu-Lab</title>

<style>
:root {
    --bg: #07111f;
    --card: rgba(13, 32, 57, 0.85);
    --accent: #00d4ff;
    --accent2: #4facfe;
    --text: #e8f1ff;
    --subtext: #9eb3cf;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* 背景グリッド */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -2;
}

/* 背景発光 */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at top right,
        rgba(0,212,255,0.18),
        transparent 40%);
    z-index: -1;
}

/* ===== Header ===== */

header {
    text-align: center;
    padding: 60px 20px 40px;
}

.lab-name {
    display: inline-block;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 3px;
    margin-bottom: 15px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0,212,255,0.6);
}

header h1 {
    font-size: 3rem;
    color: white;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

.divider {
    width: 220px;
    height: 3px;
    margin: 20px auto;
    background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
    );
}

header p {
    color: var(--subtext);
    line-height: 1.8;
}

/* ===== Main ===== */

main {
    width: min(1200px, 92%);
    margin: auto;
    padding-bottom: 60px;
}

.section-title {
    color: var(--accent);
    margin-bottom: 25px;
    font-size: 1.4rem;
}

.material-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(320px,1fr));
    gap: 25px;
}

.card {
    background: var(--card);
    border-radius: 18px;
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow:
        0 0 15px rgba(0,212,255,0.25);
}

.card h3 {
    margin-bottom: 12px;
}

.card p {
    color: var(--subtext);
    line-height: 1.7;
    min-height: 80px;
}

/* ===== Button ===== */

.button-area {
    margin-top: 20px;
}

.material-btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 10px;
    background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    transition: 0.3s;
}

.material-btn:hover {
    transform: scale(1.05);
    box-shadow:
        0 0 10px var(--accent),
        0 0 20px var(--accent),
        0 0 40px var(--accent);
}

/* ===== Footer ===== */

footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 30px 20px;
    text-align: center;
    color: var(--subtext);
}

.footer-lab {
    color: var(--accent);
    font-weight: 600;
    margin-top: 8px;
}

/* ===== Responsive ===== */

@media (max-width: 700px) {

    header h1 {
        font-size: 2rem;
    }

    .material-grid {
        grid-template-columns: 1fr;
    }

}
</style>
</head>

<body>

<header>

    <div class="lab-name">
        Imamu-Lab
    </div>

    <h1>Mathematics Learning Hub</h1>

    <div class="divider"></div>

    <p>
        数学教育のための教材ポータル<br>
        授業・演習・研修で活用できるWeb教材を提供
    </p>

</header>

<main>

    <h2 class="section-title">
        教材一覧
    </h2>

    <div class="material-grid">

        <!-- 教材カード -->

        <div class="card">

            <h3>教材タイトル（仮）</h3>

            <p>
                ここに教材の説明を記載します。
                ベクトル、関数、微積分、統計などの
                学習教材概要を掲載できます。
            </p>

            <div class="button-area">
                <a href="#"           教材を開く
                </a>
            </div>

        </div>

    </div>

</main>

<footer>

    <div>
        Mathematics Learning Hub
    </div>

    <div class="footer-lab">
        Created by Imamu-Lab
    </div>

</footer>

</body>
</html>
