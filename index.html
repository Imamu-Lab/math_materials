<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>数学教材ポータル | Imamu-Lab</title>

<style>
:root{
    --bg:#07111f;
    --card:rgba(13,32,57,0.85);
    --accent:#00d4ff;
    --accent2:#4facfe;
    --text:#e8f1ff;
    --subtext:#9eb3cf;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI","Yu Gothic UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

/* 数学・データサイエンス風グリッド背景 */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-2;
}

/* 発光エフェクト */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at top right,
            rgba(0,212,255,.18),
            transparent 40%
        );
    z-index:-1;
}

header{
    text-align:center;
    padding:60px 20px 40px;
}

.lab-name{
    display:inline-block;
    color:var(--accent);
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:15px;
    text-shadow:0 0 10px rgba(0,212,255,.8);
}

header h1{
    font-size:3rem;
    margin-bottom:15px;
    letter-spacing:2px;
}

.divider{
    width:220px;
    height:3px;
    margin:20px auto;
    background:
        linear-gradient(
            90deg,
            transparent,
            var(--accent),
            transparent
        );
}

header p{
    color:var(--subtext);
    line-height:1.8;
}

main{
    width:min(1200px,92%);
    margin:auto;
    padding-bottom:60px;
}

.section-title{
    color:var(--accent);
    margin-bottom:25px;
    font-size:1.4rem;
}

.material-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:25px;
}

.card{
    background:var(--card);
    border-radius:18px;
    padding:24px;
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:var(--accent);
    box-shadow:
        0 0 15px rgba(0,212,255,.25);
}

.card h3{
    margin-bottom:12px;
    color:white;
}

.card p{
    color:var(--subtext);
    line-height:1.7;
    margin-bottom:15px;
}

.tag{
    display:inline-block;
    padding:4px 10px;
    border-radius:20px;
    background:rgba(0,212,255,.15);
    color:var(--accent);
    font-size:.8rem;
    margin-bottom:18px;
}

.material-btn{
    display:inline-block;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:600;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
    transition:.3s;
}

.material-btn:hover{
    transform:scale(1.05);
    box-shadow:
        0 0 10px var(--accent),
        0 0 20px var(--accent),
        0 0 40px var(--accent);
}

footer{
    border-top:1px solid rgba(255,255,255,.08);
    text-align:center;
    padding:30px 20px;
    color:var(--subtext);
}

.footer-lab{
    color:var(--accent);
    font-weight:600;
    margin-top:8px;
}

@media(max-width:700px){

    header h1{
        font-size:2rem;
    }

    .material-grid{
        grid-template-columns:1fr;
    }

}
</style>

</head>
<body>

<header>

    <div class="lab-name">
        Imamu-Lab
    </div>

    <h1>Mathematics Learning Hub</h1>

    <div class="divider"></div>

    <p>
        数学教育のための教材ポータル<br>
        授業・演習・研修で活用できるWeb教材を提供
    </p>

</header>

<main>

    <h2 class="section-title">
        教材一覧
    </h2>

    <div class="material-grid">

        <!-- 教材１ -->

        <div class="card">

            <h3>円順列・ネックレス配列教材</h3>

            <p>
                円順列やネックレス配列の考え方を視覚的に学習できる教材です。
                回転による同一視や対称性を扱いながら、
                場合の数に対する理解を深めます。
            </p>

            <div class="tag">
                数学A ＞ 場合の数
            </div>

            <br>

            <a href="./cklace_math.html
                教材を開く
            </a>

        </div>

        <!-- 今後ここに教材カードを追加 -->

    </div>

</main>

<footer>

    <div>
        Mathematics Learning Hub
    </div>

    <div class="footer-lab">
        Created by Imamu-Lab
    </div>

</footer>

</body>
</html>
``
