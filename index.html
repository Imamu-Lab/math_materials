<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>数学教材ポータル</title>

<style>
:root {
    --bg: #07111f;
    --bg2: #0d2039;
    --card: rgba(13, 32, 57, 0.85);
    --accent: #00d4ff;
    --accent2: #4facfe;
    --text: #e8f1ff;
    --subtext: #9eb3cf;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* グリッド背景 */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -2;
}

/* グラデーション背景 */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at top right,
        rgba(0,212,255,0.15),
        transparent 40%);
    z-index: -1;
}

header {
    text-align: center;
    padding: 70px 20px 40px;
}

header h1 {
    font-size: 3rem;
    letter-spacing: 2px;
    color: white;
    margin-bottom: 15px;
}

header p {
    color: var(--subtext);
    font-size: 1.1rem;
}

.divider {
    width: 200px;
    height: 3px;
    margin: 25px auto;
    background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
    );
}

main {
    width: min(1200px, 92%);
    margin: auto;
}

.section-title {
    margin-bottom: 25px;
    font-size: 1.3rem;
    color: var(--accent);
}

/* カード群 */

.material-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
    gap: 25px;
}

.card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 24px;
    transition: .3s ease;
    backdrop-filter: blur(10px);
}

.card:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow:
        0 0 20px rgba(0,212,255,.25);
}

.card h3 {
    margin-bottom: 12px;
    color: white;
}

.card p {
    color: var(--subtext);
    line-height: 1.7;
    min-height: 70px;
}

.button-area {
    margin-top: 20px;
}

.material-btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    font-weight: 600;

    padding: 12px 20px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    transition: .3s ease;
}

.material-btn:hover {
    transform: scale(1.05);

    box-shadow:
        0 0 10px var(--accent),
        0 0 20px var(--accent),
        0 0 40px var(--accent);
}

footer {
    text-align: center;
    padding: 50px 20px;
    color: var(--subtext);
    font-size: 0.9rem;
}

/* レスポンシブ */

@media(max-width:700px){

    header h1{
        font-size:2rem;
    }

    .material-grid{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>

    <h1>Mathematics Learning Hub</h1>

    <div class="divider"></div>

    <p>
        数学教育のための教材ポータル
        <br>
        授業・演習・研修で活用できるWeb教材を提供
    </p>

</header>

<main>

    <h2 class="section-title">
        教材一覧
    </h2>

    <div class="material-grid">

        <!-- 教材１ -->

        <div class="card">

            <h3>教材タイトル（仮）</h3>

            <p>
                ここに教材の説明を記載します。
                ベクトル、関数、統計、確率など、
                概要を2〜3行程度で掲載できます。
            </p>

            <div class="button-area">
                <a href="#"
         教材を開く
                </a>
            </div>

        </div>

    </div>

</main>

<footer>
    Mathematics Learning Hub
</footer>

</body>
</html>
