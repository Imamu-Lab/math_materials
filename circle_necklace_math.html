<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>円のネックレス</title>
  <style>
    :root {
      --ink: #17324d;
      --muted: #5f7285;
      --panel: #ffffff;
      --line: #2d78b7;
      --circle-fill: rgba(93, 173, 226, 0.23);
      --circle-stroke: #2d78b7;
      --intersection: rgba(35, 116, 171, 0.28);
      --overlap-fill: rgba(245, 158, 11, 0.38);
      --overlap-stroke: #d97706;
      --active-fill: rgba(37, 99, 235, 0.34);
      --active-stroke: #1d4ed8;
      --focus: #2563eb;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef4f8;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      background: var(--panel);
      border-bottom: 1px solid #cedbe5;
      box-shadow: 0 2px 10px rgba(23, 50, 77, 0.08);
      z-index: 2;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 26px);
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .title-block p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .count-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 1px solid #c5d3df;
      border-radius: 12px;
      background: #f7fafc;
    }

    .count-control label {
      padding-left: 7px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    button, input {
      font: inherit;
    }

    button {
      min-width: 40px;
      min-height: 40px;
      padding: 7px 12px;
      border: 1px solid #b8c8d5;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: #edf5fb; }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.28);
      outline-offset: 2px;
    }

    .step-button {
      width: 40px;
      padding: 0;
      font-size: 22px;
      font-weight: 700;
    }

    #circleCount {
      width: 62px;
      height: 40px;
      border: 1px solid #b8c8d5;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      font-weight: 700;
    }

    #resetButton, #areaToggleButton {
      border-color: #7ba8ca;
      background: #eaf4fb;
      font-weight: 700;
    }

    #areaToggleButton[aria-pressed="true"] {
      border-color: #2563eb;
      background: #dceefe;
      color: #174a78;
    }

    main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      padding: 12px;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 280px;
      overflow: hidden;
      border: 1px solid #c5d4df;
      border-radius: 16px;
      background-color: #fff;
      background-image:
        linear-gradient(rgba(45, 120, 183, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 120, 183, 0.045) 1px, transparent 1px);
      background-size: 24px 24px;
      box-shadow: inset 0 1px 3px rgba(23, 50, 77, 0.05);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas.dragging { cursor: grabbing; }

    .area-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      min-width: 238px;
      padding: 12px 14px;
      border: 1px solid #c7d7e4;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.93);
      box-shadow: 0 4px 14px rgba(23, 50, 77, 0.10);
      pointer-events: none;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .area-panel[hidden] { display: none; }

    .area-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      font-variant-numeric: tabular-nums;
    }

    .area-row + .area-row { margin-top: 6px; }

    .area-symbol {
      font-size: 18px;
      font-weight: 800;
      color: #174a78;
    }

    .area-value {
      font-size: 21px;
      font-weight: 800;
      color: var(--ink);
    }

    .area-description {
      margin: 8px 0 0;
      padding-top: 7px;
      border-top: 1px solid #dce5ec;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      margin: 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #d2dee7;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    @media (max-width: 720px) {
      html, body { overflow: auto; }
      body { min-height: 100%; }
      header { align-items: flex-start; flex-direction: column; padding: 10px 12px; }
      .controls { justify-content: flex-start; width: 100%; }
      main { flex-basis: 520px; min-height: 420px; padding: 8px; }
      .title-block p { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-block">
      <h1>円のネックレス</h1>
      <p>円をドラッグして、外接した輪の形を変えてみよう</p>
    </div>

    <div class="controls" aria-label="操作パネル">
      <div class="count-control">
        <label for="circleCount">円の個数</label>
        <button id="decreaseButton" class="step-button" type="button" aria-label="円を1個減らす">−</button>
        <input id="circleCount" type="number" min="3" max="15" step="1" value="5" inputmode="numeric" aria-describedby="countHelp">
        <button id="increaseButton" class="step-button" type="button" aria-label="円を1個増やす">＋</button>
      </div>
      <button id="areaToggleButton" type="button" aria-pressed="false">面積を表示</button>
      <button id="resetButton" type="button">リセット</button>
      <span id="countHelp" hidden>3個から15個まで設定できます。</span>
    </div>
  </header>

  <main>
    <div id="canvasWrap" class="canvas-wrap">
      <canvas id="canvas" aria-label="外接する円を動かす図形教材"></canvas>
      <section id="areaPanel" class="area-panel" aria-live="polite" hidden>
        <div class="area-row"><span class="area-symbol">A</span><span id="areaA" class="area-value">0.000</span></div>
        <div class="area-row"><span class="area-symbol">B</span><span id="areaB" class="area-value">0.000</span></div>
        <p class="area-description">A：濃い部分の面積の和<br>B：薄い部分の面積の和<br>円の半径を1として計算</p>
      </section>
      <p class="hint">どの円でもドラッグできます</p>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('canvasWrap');
    const countInput = document.getElementById('circleCount');
    const decreaseButton = document.getElementById('decreaseButton');
    const increaseButton = document.getElementById('increaseButton');
    const resetButton = document.getElementById('resetButton');
    const areaToggleButton = document.getElementById('areaToggleButton');
    const areaPanel = document.getElementById('areaPanel');
    const areaAElement = document.getElementById('areaA');
    const areaBElement = document.getElementById('areaB');

    const MIN_COUNT = 3;
    const MAX_COUNT = 15;
    const CIRCLE_RADIUS = 30;
    const LINK_LENGTH = CIRCLE_RADIUS * 2;
    const SOLVER_ITERATIONS = 90;
    const EPSILON = 0.0001;

    let cssWidth = 0;
    let cssHeight = 0;
    let points = [];
    let count = 5;
    let activeIndex = -1;
    let activePointerId = null;
    let dragOffset = { x: 0, y: 0 };
    let areaVisible = false;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeCount(value) {
      const parsed = Number.parseInt(value, 10);
      if (Number.isNaN(parsed)) return count;
      return clamp(parsed, MIN_COUNT, MAX_COUNT);
    }

    function resizeCanvas(reinitialize = true) {
      const rect = wrap.getBoundingClientRect();
      const newWidth = Math.max(1, rect.width);
      const newHeight = Math.max(1, rect.height);
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      cssWidth = newWidth;
      cssHeight = newHeight;
      canvas.width = Math.round(newWidth * dpr);
      canvas.height = Math.round(newHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (reinitialize || points.length !== count) {
        createRegularArrangement();
      } else {
        keepAllInside();
        solveConstraints(activeIndex);
      }
      draw();
    }

    function createRegularArrangement() {
      points = [];
      const polygonRadius = LINK_LENGTH / (2 * Math.sin(Math.PI / count));
      const centerX = cssWidth / 2;
      const centerY = cssHeight / 2;
      const startAngle = -Math.PI / 2;

      for (let i = 0; i < count; i += 1) {
        const angle = startAngle + (i * Math.PI * 2) / count;
        points.push({
          x: centerX + polygonRadius * Math.cos(angle),
          y: centerY + polygonRadius * Math.sin(angle)
        });
      }

      keepAllInside();
    }

    function keepAllInside() {
      if (!points.length) return;

      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;
      for (const point of points) {
        minX = Math.min(minX, point.x - CIRCLE_RADIUS);
        maxX = Math.max(maxX, point.x + CIRCLE_RADIUS);
        minY = Math.min(minY, point.y - CIRCLE_RADIUS);
        maxY = Math.max(maxY, point.y + CIRCLE_RADIUS);
      }

      let shiftX = 0;
      let shiftY = 0;
      if (minX < 0) shiftX = -minX;
      if (maxX + shiftX > cssWidth) shiftX += cssWidth - (maxX + shiftX);
      if (minY < 0) shiftY = -minY;
      if (maxY + shiftY > cssHeight) shiftY += cssHeight - (maxY + shiftY);

      for (const point of points) {
        point.x += shiftX;
        point.y += shiftY;
      }
    }

    function solveConstraints(pinnedIndex) {
      if (points.length < 3) return;

      for (let iteration = 0; iteration < SOLVER_ITERATIONS; iteration += 1) {
        for (let i = 0; i < points.length; i += 1) {
          const j = (i + 1) % points.length;
          const a = points[i];
          const b = points[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let distance = Math.hypot(dx, dy);

          if (distance < EPSILON) {
            const angle = (i * Math.PI * 2) / points.length;
            dx = Math.cos(angle);
            dy = Math.sin(angle);
            distance = 1;
          }

          const error = (distance - LINK_LENGTH) / distance;
          if (i === pinnedIndex) {
            b.x -= dx * error;
            b.y -= dy * error;
          } else if (j === pinnedIndex) {
            a.x += dx * error;
            a.y += dy * error;
          } else {
            const correctionX = dx * error * 0.5;
            const correctionY = dy * error * 0.5;
            a.x += correctionX;
            a.y += correctionY;
            b.x -= correctionX;
            b.y -= correctionY;
          }
        }

        // 境界を制約の一部として扱い、輪全体が操作領域内に収まるようにする。
        for (let i = 0; i < points.length; i += 1) {
          if (i === pinnedIndex) continue;
          points[i].x = clamp(points[i].x, CIRCLE_RADIUS, cssWidth - CIRCLE_RADIUS);
          points[i].y = clamp(points[i].y, CIRCLE_RADIUS, cssHeight - CIRCLE_RADIUS);
        }
      }
    }

    function isAdjacent(i, j) {
      const difference = Math.abs(i - j);
      return difference === 1 || difference === points.length - 1;
    }

    function findOverlappingCircles() {
      const overlapping = new Set();
      const threshold = LINK_LENGTH - 0.4;

      for (let i = 0; i < points.length; i += 1) {
        for (let j = i + 1; j < points.length; j += 1) {
          if (isAdjacent(i, j)) continue;
          const distance = Math.hypot(points[j].x - points[i].x, points[j].y - points[i].y);
          if (distance < threshold) {
            overlapping.add(i);
            overlapping.add(j);
          }
        }
      }
      return overlapping;
    }

    function tracePolygon() {
      if (!points.length) return;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i += 1) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
    }


    function cross(a, b) {
      return a.x * b.y - a.y * b.x;
    }

    function interpolate(a, b, t) {
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t
      };
    }

    function segmentCircleBreakpoints(a, b) {
      const d = { x: b.x - a.x, y: b.y - a.y };
      const qa = d.x * d.x + d.y * d.y;
      if (qa < EPSILON) return [0, 1];

      const qb = 2 * (a.x * d.x + a.y * d.y);
      const qc = a.x * a.x + a.y * a.y - 1;
      const discriminant = qb * qb - 4 * qa * qc;
      const values = [0, 1];

      if (discriminant > EPSILON) {
        const root = Math.sqrt(discriminant);
        const t1 = (-qb - root) / (2 * qa);
        const t2 = (-qb + root) / (2 * qa);
        if (t1 > EPSILON && t1 < 1 - EPSILON) values.push(t1);
        if (t2 > EPSILON && t2 < 1 - EPSILON) values.push(t2);
      }

      values.sort((x, y) => x - y);
      return values.filter((value, index) => index === 0 || Math.abs(value - values[index - 1]) > EPSILON);
    }

    // 有向線分と単位円がつくる共通部分の有向面積。
    function circleEdgeArea(a, b) {
      const breaks = segmentCircleBreakpoints(a, b);
      let area = 0;

      for (let i = 0; i < breaks.length - 1; i += 1) {
        const p = interpolate(a, b, breaks[i]);
        const q = interpolate(a, b, breaks[i + 1]);
        const middle = interpolate(a, b, (breaks[i] + breaks[i + 1]) / 2);
        const middleInside = middle.x * middle.x + middle.y * middle.y <= 1 + EPSILON;

        if (middleInside) {
          area += cross(p, q) / 2;
        } else {
          area += Math.atan2(cross(p, q), p.x * q.x + p.y * q.y) / 2;
        }
      }
      return area;
    }

    // 多角形と、指定した中心をもつ半径1の円との共通部分の面積。
    function polygonCircleIntersectionArea(center) {
      let signedArea = 0;
      for (let i = 0; i < points.length; i += 1) {
        const j = (i + 1) % points.length;
        const a = {
          x: (points[i].x - center.x) / CIRCLE_RADIUS,
          y: (points[i].y - center.y) / CIRCLE_RADIUS
        };
        const b = {
          x: (points[j].x - center.x) / CIRCLE_RADIUS,
          y: (points[j].y - center.y) / CIRCLE_RADIUS
        };
        signedArea += circleEdgeArea(a, b);
      }
      return Math.abs(signedArea);
    }

    function calculateAreas() {
      let areaA = 0;
      for (const center of points) {
        areaA += polygonCircleIntersectionArea(center);
      }
      const totalCircleArea = points.length * Math.PI;
      const areaB = Math.max(0, totalCircleArea - areaA);
      return { areaA, areaB };
    }

    function updateAreaDisplay() {
      if (!areaVisible) return;
      const { areaA, areaB } = calculateAreas();
      areaAElement.textContent = areaA.toFixed(3);
      areaBElement.textContent = areaB.toFixed(3);
    }

    function draw() {
      ctx.clearRect(0, 0, cssWidth, cssHeight);
      if (!points.length) return;

      const overlapping = findOverlappingCircles();

      // 円の薄い内部色
      for (let i = 0; i < points.length; i += 1) {
        const point = points[i];
        ctx.beginPath();
        ctx.arc(point.x, point.y, CIRCLE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = overlapping.has(i)
          ? 'rgba(245, 158, 11, 0.38)'
          : (i === activeIndex ? 'rgba(37, 99, 235, 0.34)' : 'rgba(93, 173, 226, 0.23)');
        ctx.fill();
      }

      // 多角形内部と各円内部との共通部分を、少し濃い色で重ねる。
      ctx.save();
      tracePolygon();
      ctx.clip('nonzero');
      for (const point of points) {
        ctx.beginPath();
        ctx.arc(point.x, point.y, CIRCLE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(35, 116, 171, 0.28)';
        ctx.fill();
      }
      ctx.restore();

      // 隣接する円の中心を結ぶ線分
      tracePolygon();
      ctx.strokeStyle = '#2d78b7';
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 円周と中心点
      for (let i = 0; i < points.length; i += 1) {
        const point = points[i];
        ctx.beginPath();
        ctx.arc(point.x, point.y, CIRCLE_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = overlapping.has(i)
          ? '#d97706'
          : (i === activeIndex ? '#1d4ed8' : '#2d78b7');
        ctx.lineWidth = i === activeIndex ? 3.2 : 2.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(point.x, point.y, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = overlapping.has(i) ? '#b45309' : '#17324d';
        ctx.fill();
      }
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function hitTest(position) {
      let nearest = -1;
      let nearestDistance = Infinity;
      for (let i = 0; i < points.length; i += 1) {
        const distance = Math.hypot(position.x - points[i].x, position.y - points[i].y);
        if (distance <= CIRCLE_RADIUS + 8 && distance < nearestDistance) {
          nearest = i;
          nearestDistance = distance;
        }
      }
      return nearest;
    }

    function onPointerDown(event) {
      if (activePointerId !== null) return;
      const position = canvasPoint(event);
      const index = hitTest(position);
      if (index < 0) return;

      event.preventDefault();
      activeIndex = index;
      activePointerId = event.pointerId;
      dragOffset.x = points[index].x - position.x;
      dragOffset.y = points[index].y - position.y;
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
      draw();
    }

    function onPointerMove(event) {
      if (event.pointerId !== activePointerId || activeIndex < 0) return;
      event.preventDefault();
      const position = canvasPoint(event);
      points[activeIndex].x = clamp(position.x + dragOffset.x, CIRCLE_RADIUS, cssWidth - CIRCLE_RADIUS);
      points[activeIndex].y = clamp(position.y + dragOffset.y, CIRCLE_RADIUS, cssHeight - CIRCLE_RADIUS);
      solveConstraints(activeIndex);
      draw();
    }

    function endPointer(event) {
      if (event.pointerId !== activePointerId) return;
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
      activePointerId = null;
      activeIndex = -1;
      canvas.classList.remove('dragging');
      solveConstraints(-1);
      draw();
    }

    // 円の個数変更後、配置と面積表示を必ず同じタイミングで更新する。
    function updateCountAndAreas(value) {
      count = normalizeCount(value);
      countInput.value = String(count);
      activePointerId = null;
      activeIndex = -1;
      canvas.classList.remove('dragging');

      // 新しい個数に合わせて正多角形状に再配置する。
      createRegularArrangement();

      // 図形を再描画する。draw()内でも面積表示が更新される。
      draw();

      // 個数変更時の更新を明示的に保証する。
      // 面積表示がオンなら、新しい円の個数でA・Bを再計算する。
      if (areaVisible) {
        updateAreaDisplay();
      }
    }

    // 直接入力では、有効な3～15の整数が入力された時点で即時更新する。
    countInput.addEventListener('input', () => {
      const value = Number.parseInt(countInput.value, 10);
      if (Number.isInteger(value) && value >= MIN_COUNT && value <= MAX_COUNT) {
        updateCountAndAreas(value);
      }
    });

    // 入力欄から離れたときは、空欄や範囲外の値も3～15に補正して更新する。
    countInput.addEventListener('change', () => updateCountAndAreas(countInput.value));
    countInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        updateCountAndAreas(countInput.value);
        countInput.blur();
      }
    });

    // ＋・－ボタンでも、配置とA・Bを同時に更新する。
    decreaseButton.addEventListener('click', () => updateCountAndAreas(count - 1));
    increaseButton.addEventListener('click', () => updateCountAndAreas(count + 1));
    resetButton.addEventListener('click', () => updateCountAndAreas(count));
    areaToggleButton.addEventListener('click', () => {
      areaVisible = !areaVisible;
      areaPanel.hidden = !areaVisible;
      areaToggleButton.setAttribute('aria-pressed', String(areaVisible));
      areaToggleButton.textContent = areaVisible ? '面積を隠す' : '面積を表示';
      updateAreaDisplay();
    });

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    const resizeObserver = new ResizeObserver(() => resizeCanvas(true));
    resizeObserver.observe(wrap);
  </script>
</body>
</html>
