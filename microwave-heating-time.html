<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子レンジでおいしく調理！</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;color:#273449;background:linear-gradient(135deg,#fff7ed,#fffbeb,#fff1f2);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}.header h1{font-size:clamp(26px,4vw,42px);margin:4px 0;display:flex;align-items:center;gap:14px}.microwaveIcon{position:relative;display:inline-block;width:58px;height:43px;border:4px solid #f97316;border-radius:8px;background:#fff;flex:none}.microwaveIcon i{position:absolute;left:5px;top:5px;width:34px;height:27px;border:3px solid #475569;border-radius:4px;background:linear-gradient(135deg,#cbd5e1,#64748b)}.microwaveIcon b,.microwaveIcon em{position:absolute;right:5px;width:7px;height:7px;border-radius:50%;background:#f97316}.microwaveIcon b{top:7px}.microwaveIcon em{top:20px}.microwaveIcon:after{content:"";position:absolute;left:5px;right:5px;bottom:-8px;height:4px;border-radius:4px;background:#475569}.grid{display:grid;grid-template-columns:1fr 1.06fr;gap:20px}.card{background:#fff;border-radius:30px;padding:25px;box-shadow:0 14px 36px #7c2d1220}.title{display:flex;align-items:center;gap:12px}.icon{font-size:30px;background:#ffedd5;border-radius:16px;padding:10px}.title small{color:#64748b;font-weight:800}.title h2{margin:2px 0;font-size:25px}.settings{background:#fffbeb;border:2px solid #fde68a;border-radius:24px;padding:17px;margin:18px 0}.foodLabel{display:block;font-weight:900;margin-bottom:14px}input{width:100%;border:2px solid #dbe2ea;border-radius:13px;padding:10px;text-align:center;font-size:25px;font-weight:900;outline:none;background:#fff}input:focus{border-color:#fb923c}.foodLabel input{text-align:left;margin-top:6px;font-size:21px}.row5{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:end}.row2{display:flex;gap:8px;align-items:end;margin-top:15px}.field{font-weight:900;text-align:center;color:#5e6b7d}.unit{padding-bottom:13px;font-weight:900}.red{color:#dc2626}.question{border:2px solid #ffedd5;border-radius:22px;padding:16px;text-align:center;font-size:19px;font-weight:900;line-height:1.7}.question strong{font-size:26px;color:#ea580c}.question .target{color:#dc2626}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.answer{background:#f8fafc;padding:13px;border-radius:18px;text-align:center;font-weight:900}.btn{width:100%;border:0;border-radius:17px;padding:17px;background:#f97316;color:#fff;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 7px 15px #c2410c33}.btn:hover{background:#ea580c}.btn:disabled{opacity:.55;cursor:not-allowed}.ovenCard{background:linear-gradient(#475569,#111827)}.machine{background:#e5e7eb;border-radius:28px;padding:20px}.displayRow{display:flex;justify-content:space-between;align-items:center}.lights{display:flex;gap:7px}.light{width:12px;height:12px;border-radius:50%}.screen{background:#111827;color:#4ade80;padding:9px 16px;border-radius:9px;font:bold 22px monospace}.oven{height:404px;margin-top:15px;border:10px solid #71717a;border-radius:25px;background:linear-gradient(#18181b,#000);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.oven:before{content:"";position:absolute;inset:0;opacity:.13;background:repeating-linear-gradient(0deg,transparent,transparent 8px,#fff 9px)}.plate{position:absolute;bottom:25px;width:260px;height:60px;border-radius:50%;background:#bae6fd66;border:4px solid #e0f2fe99}.foodScene{position:relative;z-index:2;text-align:center;color:white;font-weight:900;font-size:20px}.nikuman{width:210px;height:155px;position:relative;margin:0 auto 8px;animation:float 2s ease-in-out infinite}.bun{position:absolute;left:13px;right:13px;bottom:0;height:137px;border:4px solid #fef3c7;border-radius:48% 48% 42% 42%;background:linear-gradient(135deg,#fff,#fffbeb,#fde68a);box-shadow:0 15px 25px #0008}.fold{position:absolute;left:50%;top:4px;width:4px;height:53px;background:#f5cf7a80;transform-origin:bottom;border-radius:4px}.steam{display:none;position:absolute;width:28px;height:75px;top:-45px;z-index:4;opacity:.8}.s1{left:55px}.s2{right:46px;animation-delay:.5s}.steam i{position:absolute;left:7px;width:15px;height:30px;border-left:5px solid rgba(255,255,255,.8);border-radius:50%;animation:steamWisp 1.8s ease-in-out infinite}.steam i:nth-child(2){top:19px;left:1px;animation-delay:.25s}.steam i:nth-child(3){top:38px;left:10px;animation-delay:.5s}.showSteam .steam{display:block}.burnt .bun{background:linear-gradient(135deg,#52525b,#050505,#27272a);border-color:#18181b}.burnt{animation:shake .38s infinite}.eye{display:none;position:absolute;top:53px;width:45px;height:55px;background:white;border:4px solid #18181b;border-radius:50%;z-index:3}.burnt .eye{display:block}.eye.l{left:43px}.eye.r{right:43px}.pupil{width:12px;height:15px;background:#000;border-radius:50%;position:absolute;bottom:7px}.eye.l .pupil{right:4px}.eye.r .pupil{left:4px}.mouth{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:17px;width:66px;height:44px;background:#7f1d1d;border:4px solid #09090b;border-radius:50%;z-index:3}.burnt .mouth{display:block}.smoke{display:none;position:absolute;font-size:54px;top:-26px;filter:grayscale(1);animation:steam 1.2s infinite}.burnt .smoke{display:block}.smoke.a{left:4px}.smoke.b{right:-4px;animation-delay:.3s}.bang{display:none;position:absolute;font-size:37px}.burnt .bang{display:block}.bang.a{left:-11px;top:45px}.bang.b{right:-15px;top:19px}.status h3{font-size:29px;margin:6px}.status p{margin:4px}.result{display:none;background:#fff;border-radius:20px;padding:16px;margin-top:14px}.resultTop{display:flex;align-items:center;justify-content:space-between;gap:12px}.retry{border:0;background:#f97316;color:#fff;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer}.footer{text-align:center;color:#64748b;font-size:13px;font-weight:700;margin-top:18px}@keyframes float{50%{transform:translateY(-6px)}}@keyframes steamWisp{0%{transform:translate(0,10px) scale(.7);opacity:0}45%{opacity:.9}100%{transform:translate(8px,-15px) scale(1.15);opacity:0}}@keyframes shake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}.heating .nikuman{animation:heat .55s infinite}.heating .steam{display:block}.heating .plate{animation:spin 1s linear infinite}.sparkles{display:none;color:#fde047;font-size:30px}.heating .sparkles{display:block}@keyframes heat{50%{transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){.grid{grid-template-columns:1fr}.row5{grid-template-columns:1fr auto 1fr}.row5 .field:last-child{grid-column:1/2}.oven{height:390px}}@media(max-width:500px){.wrap{padding:12px}.card{padding:16px}.row5{grid-template-columns:1fr auto}.row5 .field:last-child{grid-column:1/2}.oven{height:360px}.nikuman{transform:scale(.9)}}
</style>

<style>
.header{justify-content:flex-start}.header h1{display:flex;align-items:center;gap:14px}
.microwaveIcon{position:relative;display:inline-block;width:62px;height:45px;border:4px solid #f97316;border-radius:8px;background:#fff;flex:none;box-shadow:0 3px 0 #c2410c}
.microwaveIcon .door{position:absolute;left:5px;top:5px;width:38px;height:27px;border:3px solid #475569;border-radius:4px;background:linear-gradient(135deg,#dbeafe,#64748b)}
.microwaveIcon .knob{position:absolute;right:5px;width:8px;height:8px;border-radius:50%;background:#f97316}.microwaveIcon .k1{top:7px}.microwaveIcon .k2{top:21px}
.steam{display:none!important;position:absolute;width:32px;height:80px;top:-52px;z-index:5;opacity:.9}.heating .steam,.showSteam .steam{display:block!important}.steam i{position:absolute;display:block;width:18px;height:34px;border-left:5px solid rgba(255,255,255,.9);border-radius:50%;animation:steamWisp 1.7s ease-in-out infinite}.steam i:nth-child(1){left:8px;top:36px}.steam i:nth-child(2){left:1px;top:17px;animation-delay:.22s}.steam i:nth-child(3){left:10px;top:0;animation-delay:.44s}
@keyframes steamWisp{0%{transform:translate(0,10px) scale(.72);opacity:0}35%{opacity:.95}100%{transform:translate(8px,-17px) scale(1.15);opacity:0}}
</style>

<style>
/* はっきり見える半透明・水色の氷 */
.iceShell,.frostLayer,.coldMist{display:none;pointer-events:none;position:absolute}
.nikuman.frozen .bun{border-color:#7dd3fc;background:linear-gradient(135deg,#f8fdff,#e5f7ff,#bae6fd);box-shadow:inset 0 0 25px rgba(56,189,248,.7),0 15px 25px #0008}
.nikuman.frozen .iceShell{display:block;z-index:6;left:-2px;right:-2px;bottom:-8px;height:160px;border:9px solid rgba(56,189,248,.9);border-radius:50% 50% 44% 44%;background:linear-gradient(130deg,rgba(224,247,255,.76),rgba(125,211,252,.6) 30%,rgba(186,230,253,.5) 58%,rgba(14,165,233,.58));box-shadow:inset 15px 10px 16px rgba(255,255,255,.85),inset -15px -10px 20px rgba(2,132,199,.4),0 0 24px rgba(56,189,248,.95);animation:iceGlow 2s ease-in-out infinite}
.nikuman.frozen .iceShell:before,.nikuman.frozen .iceShell:after{content:"";position:absolute;background:rgba(255,255,255,.9);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.nikuman.frozen .iceShell:before{width:34px;height:34px;left:20px;top:42px}.nikuman.frozen .iceShell:after{width:27px;height:27px;right:24px;top:75px}
.nikuman.frozen .frostLayer{display:block;z-index:7;left:9px;right:9px;bottom:2px;height:146px;border-radius:50% 50% 43% 43%;background:linear-gradient(68deg,transparent 0 31%,rgba(255,255,255,.92) 32% 34%,transparent 35%),linear-gradient(118deg,transparent 0 57%,rgba(224,247,255,.95) 58% 60%,transparent 61%),radial-gradient(ellipse at 25% 20%,rgba(255,255,255,.9) 0 7%,transparent 8%);opacity:.95}
.nikuman.frozen .coldMist{display:block;z-index:8;bottom:-2px;width:90px;height:27px;border-radius:50%;border-top:6px solid rgba(186,230,253,.95);filter:blur(2px);animation:coldDrift 2.2s ease-in-out infinite}.cm1{left:-16px}.cm2{right:-16px;animation-delay:.8s}
@keyframes iceGlow{0%,100%{filter:brightness(.95)}50%{filter:brightness(1.2)}}
@keyframes coldDrift{0%{opacity:0;transform:translateX(-9px)}45%{opacity:.95}100%{opacity:0;transform:translateX(20px) translateY(-8px)}}
</style>

<style>
/* 中心だけが冷たい場合 */
.coldCenter{display:none;pointer-events:none;position:absolute;z-index:6;left:50%;top:66px;width:88px;height:72px;transform:translate(-50%,-50%);border:5px solid rgba(56,189,248,.88);border-radius:50%;background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.88) 0 8%,rgba(186,230,253,.72) 22%,rgba(125,211,252,.62) 55%,rgba(14,165,233,.5) 100%);box-shadow:inset 7px 5px 11px rgba(255,255,255,.75),inset -7px -5px 12px rgba(2,132,199,.32),0 0 15px rgba(56,189,248,.85);animation:centerIceGlow 1.9s ease-in-out infinite}
.coldCenter::before,.coldCenter::after{content:"";position:absolute;height:3px;border-radius:3px;background:rgba(255,255,255,.9);transform-origin:left center}
.coldCenter::before{left:18px;top:24px;width:47px;transform:rotate(28deg)}
.coldCenter::after{left:25px;top:44px;width:39px;transform:rotate(-32deg)}
.nikuman.centerCold .coldCenter{display:block}
.nikuman.centerCold .bun{background:radial-gradient(circle at 50% 48%,rgba(186,230,253,.72) 0 21%,#fff 38%,#fffbeb 72%,#fde68a 100%)}
@keyframes centerIceGlow{0%,100%{filter:brightness(.96);opacity:.88}50%{filter:brightness(1.18);opacity:1}}
.title h2:empty{display:none}.title small{font-size:16px}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><h1><span class="microwaveIcon" aria-hidden="true"><span class="door"></span><span class="knob k1"></span><span class="knob k2"></span></span>電子レンジでおいしく調理！</h1></header>
<div class="grid">
<section class="card">
<div class="title"><div class="icon">⚙️</div><div><small>問題の条件を自由に設定</small></div></div>
<div class="settings">

<div class="row5"><label class="field">もとのW<input id="baseW" value="500" inputmode="numeric"></label><span class="unit">Wで</span><label class="field">分<input id="baseMin" value="3" inputmode="numeric"></label><span class="unit">分</span><label class="field">秒<input id="baseSec" value="00" inputmode="numeric"></label></div>
<div class="row2"><label class="field red" style="flex:1">変更後のW<input id="targetW" value="600" inputmode="numeric"></label><span class="unit">Wでは？</span></div>
</div>
<div class="question"><strong id="qBaseW">500W</strong>で <strong id="qBaseTime">3分00秒</strong>なら、<br><strong class="target" id="qTargetW">600W</strong>では何分何秒？</div>
<div class="answers"><label class="answer">答え（分）<input id="ansMin" placeholder="0" inputmode="numeric"></label><label class="answer">答え（秒）<input id="ansSec" placeholder="00" inputmode="numeric"></label></div>
<button class="btn" id="heatBtn">⚡ この時間で加熱する</button>
</section>
<section class="card ovenCard"><div class="machine"><div class="displayRow"><div class="lights"><i class="light" style="background:#f87171"></i><i class="light" style="background:#fbbf24"></i><i class="light" style="background:#34d399"></i></div><div class="screen">🕒 <span id="clock">0:00</span></div></div>
<div class="oven" id="oven"><div class="plate"></div><div class="foodScene"><div class="nikuman frozen" id="nikuman">
              <span class="coldMist cm1"></span><span class="coldMist cm2"></span>
              <span class="iceShell" aria-hidden="true"></span><span class="frostLayer" aria-hidden="true"></span><span class="steam s1"><i></i><i></i><i></i></span><span class="steam s2"><i></i><i></i><i></i></span><span class="smoke a">💨</span><span class="smoke b">💨</span><span class="bang a">💥</span><span class="bang b">⚡</span><span class="coldCenter" aria-hidden="true"></span><div class="bun" id="bun"><div class="fold" style="transform:translateX(-50%) rotate(-35deg)"></div><div class="fold" style="transform:translateX(-50%) rotate(-18deg)"></div><div class="fold"></div><div class="fold" style="transform:translateX(-50%) rotate(18deg)"></div><div class="fold" style="transform:translateX(-50%) rotate(35deg)"></div><div class="eye l"><i class="pupil"></i></div><div class="eye r"><i class="pupil"></i></div><div class="mouth"></div></div></div><div class="sparkles">✨　✨</div><div class="status"><h3 id="statusTitle"></h3><p id="statusText">ふっくら冷凍の肉まんを入れました</p></div></div></div></div>
<div class="result" id="result"><div class="resultTop"><div><b id="resultTitle"></b><div id="resultText"></div></div><button class="retry" id="retry">↻ もう一度</button></div></div></section>
</div><div class="footer">※教材上のモデルです。実際の加熱では商品の表示や電子レンジの説明書に従ってください。</div></div>
<script>
const $=id=>document.getElementById(id);const fields=['baseW','baseMin','baseSec','targetW'];
function digits(el,max){el.value=el.value.replace(/[^0-9]/g,'');if(max!==undefined&&Number(el.value)>max)el.value=max;}
function fmt(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+'分'+String(sec%60).padStart(2,'0')+'秒'}
function vals(){let base=Number($('baseW').value),secs=Number($('baseMin').value||0)*60+Number($('baseSec').value||0),target=Number($('targetW').value);return{base,secs,target,correct:target>0?base*secs/target:0}}
function update(){let v=vals();$('qBaseW').textContent=($('baseW').value||'?')+'W';$('qBaseTime').textContent=fmt(v.secs);$('qTargetW').textContent=($('targetW').value||'?')+'W';reset(false)}
fields.forEach(id=>$(id).addEventListener('input',e=>{digits(e.target,id==='baseSec'?59:undefined);update()}));['ansMin','ansSec'].forEach(id=>$(id).addEventListener('input',e=>{digits(e.target,id==='ansSec'?59:undefined);$('clock').textContent=($('ansMin').value||'0')+':'+String($('ansSec').value||'0').padStart(2,'0')}));
function reset(clear=true){$('oven').classList.remove('heating');$('nikuman').classList.remove('burnt','showSteam','centerCold');$('nikuman').classList.add('frozen');$('statusTitle').textContent='';$('statusText').textContent='冷凍の肉まんを入れました';$('result').style.display='none';$('heatBtn').disabled=false;if(clear){$('ansMin').value='';$('ansSec').value='';$('clock').textContent='0:00'}}$('retry').onclick=()=>reset(true);
$('heatBtn').onclick=()=>{let v=vals(),entered=Number($('ansMin').value||0)*60+Number($('ansSec').value||0);if(!v.base||!v.target||!v.secs){alert('ワット数と、もとの時間を正しく設定してください。');return}if(entered<=0){alert('加熱時間を入力してください。');return}$('heatBtn').disabled=true;$('oven').classList.add('heating');$('statusTitle').textContent='加熱中…';$('statusText').textContent='電子レンジががんばっています！';setTimeout(()=>{let r=entered/v.correct,type,title,text;if(Math.abs(entered-v.correct)<=1){type='perfect';title='大成功！';text='肉まんがふっくら、おいしくできました！'}else if(r<.65){type='frozen';title='まだカチコチ！';text='加熱時間がかなり短かったようです。'}else if(r<.92){type='cold';title='中心が冷たい…';text='もう少し長く加熱するとよさそうです。'}else if(r<=1.15){type='near';title='おしい！';text='適切な時間は '+fmt(v.correct)+' です。'}else if(r<=1.55){type='hot';title='あつあつ注意！';text='少し加熱しすぎました。'}else{type='burnt';title='事件発生！ 肉まんが炭に!?';text='加熱時間が長すぎました。肉まんがあなたを憎んでます。'}$('oven').classList.remove('heating');$('nikuman').classList.remove('frozen','centerCold','showSteam','burnt');if(type==='frozen')$('nikuman').classList.add('frozen');if(type==='cold')$('nikuman').classList.add('centerCold');if(type==='burnt')$('nikuman').classList.add('burnt');if(type==='perfect'||type==='hot'||type==='near')$('nikuman').classList.add('showSteam');$('statusTitle').textContent=title;$('statusText').textContent=text;$('resultTitle').textContent=title;$('resultText').textContent=text;$('result').style.display='block'},2200)};update();
</script>
</body></html>
