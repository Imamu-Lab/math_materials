<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角の2倍の作図・自由操作版</title>
<style>
:root{--navy:#203552;--blue:#2d74d2;--orange:#ef8435;--green:#279672;--pink:#c04f91;--ink:#1d2430;--paper:#f7f9fc}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Yu Gothic",sans-serif;background:#eaf0f7;color:var(--ink)}main{width:min(1220px,97vw);margin:18px auto;background:#fff;border-radius:22px;box-shadow:0 16px 42px #20355224;overflow:hidden}header{padding:18px 28px;background:var(--navy);color:#fff}h1{margin:0;font-size:clamp(25px,4vw,38px)}header p{margin:5px 0 0;opacity:.88}.layout{display:grid;grid-template-columns:370px 1fr;gap:18px;padding:20px}.panel,.stage{background:var(--paper);border:1px solid #d8e0eb;border-radius:16px}.panel{padding:18px}.badge{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:20px}h2{margin:9px 0 7px;color:var(--navy)}.instruction{min-height:85px;line-height:1.7}.settings{display:grid;gap:9px;margin-top:12px}.controlbox{padding:10px 12px;background:#fff;border:1px solid #d8e0eb;border-radius:11px}.controlhead{display:flex;justify-content:space-between;gap:10px;font-weight:700;color:var(--navy)}input[type=range]{width:100%;margin:9px 0 1px}.note{font-size:12px;color:#687487;line-height:1.5}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 15px;font-size:15px;font-weight:700;cursor:pointer}.next{background:var(--blue);color:#fff;flex:1}.back,.reset{background:#e2e8f0}button:disabled{opacity:.4;cursor:not-allowed}.status{color:#687487;font-size:14px;margin-top:11px}.steps{display:flex;gap:7px;margin-top:12px}.stepdot{height:7px;flex:1;border-radius:8px;background:#d9e0e9}.stepdot.on{background:var(--green)}.stage{position:relative;min-height:650px;overflow:hidden;background:radial-gradient(circle at center,#fff 0,#fbfcff 72%,#f2f6fb 100%)}svg{display:block;width:100%;height:100%;min-height:650px;touch-action:none}.ray{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}.construction{fill:none;stroke-width:2.5}.label{font:22px serif}.small{font:15px sans-serif}.hidden{opacity:0;pointer-events:none}.fade{transition:opacity .3s}.point{stroke:#fff;stroke-width:3}.handle{cursor:grab;filter:drop-shadow(0 2px 3px #0005)}.handle:active{cursor:grabbing}.draw{stroke-dasharray:2500;stroke-dashoffset:2500;animation:draw 1s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}.resultbg{fill:#ffffffdd;stroke:#d8e0eb}.result{font:700 21px sans-serif;fill:var(--navy)}.hint{position:absolute;right:12px;bottom:10px;background:#203552e8;color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;pointer-events:none}footer{text-align:center;color:#687487;font-size:13px;padding:0 20px 17px}@media(max-width:900px){.layout{grid-template-columns:1fr}.instruction{min-height:0}.stage,svg{min-height:520px}}
</style></head>
<body><main><header><h1>角の2倍の作図</h1><p>点X・点A・点Bをドラッグして、自由に作図を確かめられます。</p></header><div class="layout">
<section class="panel" aria-live="polite"><div class="badge" id="badge">0</div><h2 id="heading"></h2><div class="instruction" id="instruction"></div>
<div class="settings">
<div class="controlbox"><div class="controlhead"><span>∠XOY</span><span id="angleValue">35°</span></div><input id="angleSlider" type="range" min="1" max="359" value="35" step="1" aria-label="角XOY"></div>
<div class="controlbox"><div class="controlhead"><span>点Aの位置 OA</span><span id="aValue">210</span></div><input id="aSlider" type="range" min="80" max="275" value="210" step="1" aria-label="点Aの位置"></div>
<div class="controlbox"><div class="controlhead"><span>点Bの位置 OB</span><span id="bValue">230</span></div><input id="bSlider" type="range" min="80" max="275" value="230" step="1" aria-label="点Bの位置"></div>
<div class="note">図上では、青いXを円周方向に、オレンジのA・ピンクのBをそれぞれの辺に沿ってドラッグできます。</div></div>
<div class="steps"><i class="stepdot"></i><i class="stepdot"></i><i class="stepdot"></i><i class="stepdot"></i></div><div class="status" id="status"></div><div class="buttons"><button class="back" id="back">戻る</button><button class="next" id="next">次へ</button><button class="reset" id="reset">最初から</button></div></section>
<section class="stage"><svg id="svg" viewBox="0 0 760 650" aria-label="角の2倍の作図">
<circle cx="380" cy="325" r="282" fill="none" stroke="#e1e7ef" stroke-dasharray="5 8"/>
<line class="ray" id="rayOY"/><line class="ray" id="rayOX"/><circle cx="380" cy="325" r="6" fill="#203552"/><text class="label" x="350" y="355">O</text><text class="label" id="labelY">Y</text><path id="angleArc" fill="none" stroke="#2d74d2" stroke-width="5"/>
<g id="s1" class="fade hidden"><g id="aGroup" class="handle"><circle class="point" id="pointA" r="11" fill="#ef8435"/><text class="label" id="labelA" fill="#ef8435">A</text></g><g id="bGroup" class="handle"><circle class="point" id="pointB" r="11" fill="#c04f91"/><text class="label" id="labelB" fill="#c04f91">B</text></g></g>
<g id="s2" class="fade hidden"><circle id="circleA" class="construction" stroke="#ef8435"/><text class="small" id="circleAText" fill="#ef8435">中心A・半径AB</text></g>
<g id="s3" class="fade hidden"><circle id="circleO" class="construction" stroke="#2d74d2"/><circle class="point" id="pointP" r="9" fill="#279672"/><text class="label" id="labelP" fill="#279672">P</text></g>
<g id="s4" class="fade hidden"><line id="lineOP" stroke="#279672" stroke-width="6" stroke-linecap="round"/><path id="equalArc1" fill="none" stroke="#2d74d2" stroke-width="7"/><path id="equalArc2" fill="none" stroke="#279672" stroke-width="7"/><rect class="resultbg" x="452" y="573" width="290" height="55" rx="12"/><text class="result" x="470" y="608">∠POY ＝ 2 × ∠XOY</text></g>
<g id="xGroup" class="handle"><circle id="xHandle" r="14" fill="#2d74d2" stroke="#fff" stroke-width="4"/><text class="label" id="labelX">X</text></g>
</svg><div class="hint">空白をクリックで次へ・各点をドラッグ</div></section></div><footer>角度は1°から359°まで設定できます。360°と0°は同じ方向になるため、最大値を359°としています。</footer></main>
<script>
const O={x:380,y:325}, guideR=282, rayLen=290;let step=0,angle=35,aDist=210,bDist=230,drag=null,moved=false;
const $=s=>document.querySelector(s),svg=$('#svg');
const data=[['はじめに','∠XOYの2倍の角を作図します。点Xを動かすと、角度を1°から359°まで変更できます。'],['手順1','辺OX上の好きな場所に点 <b>A</b>、辺OY上の好きな場所に点 <b>B</b> をとります。AとBをドラッグできます。'],['手順2','点 <b>A</b> を中心として、半径 <b>AB</b> の円をかきます。'],['手順3','点 <b>O</b> を中心として、半径 <b>OB</b> の円をかきます。点B以外の交点を <b>P</b> とします。'],['手順4・完成','直線 <b>OP</b> を、<b>Pを突き抜けるように</b>延長してひきます。']];
function norm(d){return(d%360+360)%360}function polar(c,r,d){const a=d*Math.PI/180;return{x:c.x+r*Math.cos(a),y:c.y-r*Math.sin(a)}}function line(el,p,q){el.setAttribute('x1',p.x);el.setAttribute('y1',p.y);el.setAttribute('x2',q.x);el.setAttribute('y2',q.y)}
function arc(r,a1,a2){let delta=norm(a2-a1);if(delta===0&&a1!==a2)delta=359.999;const p=polar(O,r,a1),q=polar(O,r,a1+delta),large=delta>180?1:0;return`M ${p.x} ${p.y} A ${r} ${r} 0 ${large} 0 ${q.x} ${q.y}`}
function geometry(){
 const X=polar(O,rayLen,angle),Y=polar(O,rayLen,0),A=polar(O,aDist,angle),B=polar(O,bDist,0),P=polar(O,bDist,norm(2*angle));
 // Extend OP well beyond P while remaining visible: at least 55 px past P.
 const opEnd=polar(O,Math.max(bDist+65,rayLen),norm(2*angle));line($('#rayOY'),O,Y);line($('#rayOX'),O,X);line($('#lineOP'),O,opEnd);
 $('#labelY').setAttribute('x',Y.x+9);$('#labelY').setAttribute('y',Y.y+8);
 for(const [id,p] of [['xHandle',X],['pointA',A],['pointB',B],['pointP',P]]){$('#'+id).setAttribute('cx',p.x);$('#'+id).setAttribute('cy',p.y)}
 for(const [id,p,dx,dy] of [['labelX',X,15,-10],['labelA',A,12,-10],['labelB',B,10,28],['labelP',P,10,-12]]){$('#'+id).setAttribute('x',p.x+dx);$('#'+id).setAttribute('y',p.y+dy)}
 const ab=Math.hypot(A.x-B.x,A.y-B.y);$('#circleA').setAttribute('cx',A.x);$('#circleA').setAttribute('cy',A.y);$('#circleA').setAttribute('r',ab);$('#circleO').setAttribute('cx',O.x);$('#circleO').setAttribute('cy',O.y);$('#circleO').setAttribute('r',bDist);
 $('#circleAText').setAttribute('x',Math.max(10,Math.min(650,A.x+20)));$('#circleAText').setAttribute('y',Math.max(22,Math.min(628,A.y-ab-8)));
 $('#angleArc').setAttribute('d',arc(48,0,angle));$('#equalArc1').setAttribute('d',arc(67,0,angle));$('#equalArc2').setAttribute('d',arc(86,angle,2*angle));
 $('#angleValue').textContent=angle+'°';$('#aValue').textContent=Math.round(aDist);$('#bValue').textContent=Math.round(bDist);$('#angleSlider').value=angle;$('#aSlider').value=aDist;$('#bSlider').value=bDist;
}
function render(anim=true){$('#badge').textContent=step;$('#heading').textContent=data[step][0];$('#instruction').innerHTML=data[step][1];$('#status').textContent=`手順 ${step} / 4`;$('#back').disabled=step===0;$('#next').disabled=step===4;document.querySelectorAll('.stepdot').forEach((e,i)=>e.classList.toggle('on',i<step));for(let i=1;i<=4;i++)$('#s'+i).classList.toggle('hidden',i>step);geometry();if(anim&&step>1){const e=step===2?$('#circleA'):step===3?$('#circleO'):$('#lineOP');e.classList.remove('draw');void e.getBoundingClientRect();e.classList.add('draw')}}
function next(){if(step<4){step++;render()}}function back(){if(step>0){step--;render(false)}}function reset(){step=0;angle=35;aDist=210;bDist=230;render(false)}
$('#next').onclick=next;$('#back').onclick=back;$('#reset').onclick=reset;$('#angleSlider').oninput=e=>{angle=+e.target.value;geometry()};$('#aSlider').oninput=e=>{aDist=+e.target.value;geometry()};$('#bSlider').oninput=e=>{bDist=+e.target.value;geometry()};
function svgPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function start(type,e){drag=type;moved=false;svg.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation()}
$('#xGroup').onpointerdown=e=>start('x',e);$('#aGroup').onpointerdown=e=>start('a',e);$('#bGroup').onpointerdown=e=>start('b',e);
svg.onpointermove=e=>{if(!drag)return;const p=svgPoint(e),dx=p.x-O.x,dy=O.y-p.y;moved=true;if(drag==='x'){angle=Math.round(norm(Math.atan2(dy,dx)*180/Math.PI));if(angle===0)angle=359}else if(drag==='a'){const ux=Math.cos(angle*Math.PI/180),uy=-Math.sin(angle*Math.PI/180);aDist=Math.max(80,Math.min(275,dx*ux+(p.y-O.y)*uy))}else{bDist=Math.max(80,Math.min(275,dx))}geometry()};
svg.onpointerup=e=>{if(drag){drag=null;try{svg.releasePointerCapture(e.pointerId)}catch(_){}}};svg.onclick=e=>{if(!moved&&!e.target.closest('.handle'))next();moved=false};render(false);
</script></body></html>
