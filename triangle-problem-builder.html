r:var(--blue);background:var(--blueSoft)}.card.target{border-color:var(--orange);background:var(--orangeSoft)}.card.slot{border:2px dashed #eba978;background:#fff8f3}.card.disabled{background:#f1f3f5;border-color:#d2d8df;opacity:.72}.role{font-size:12px;font-weight:800;color:var(--muted);min-height:22px}.known .role{color:var(--blue)}.target .role{color:var(--orange)}.math{font-size:25px;font-weight:800;min-height:52px;display:flex;align-items:center;justify-content:center}.actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:auto}.actions button{font-size:12px;padding:7px 8px;border-radius:7px;border:1px solid #bac5d0;background:#fff;font-weight:700;cursor:pointer}.target .actions button{border-color:#e8a16c}.resetRole{display:flex;justify-content:center;margin-top:11px}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}.figure,.right{padding:15px;min-height:620px}.svgWrap{width:100%;aspect-ratio:1/1;min-height:440px}svg{width:100%;height:100%;display:block}svg text{font-family:"Yu Gothic UI",Meiryo,sans-serif;pointer-events:none}.edge{stroke:#dce2e9;stroke-width:3.2;stroke-linecap:round}.edge.known{stroke:var(--blue);stroke-width:8}.edge.target{stroke:var(--orange);stroke-width:8}.edgeLabel{fill:#c8d0da;font-size:21px;font-weight:800}.edgeLabel.known{fill:var(--blue)}.edgeLabel.target{fill:var(--orange)}.vertex{fill:#c0c8d2;stroke:#fff;stroke-width:3}.vertexLabel{fill:#b1bbc6;font-size:22px;font-weight:800}.angleArc{fill:none;stroke-width:7;stroke-linecap:round}.angleArc.known{stroke:var(--blue)}.angleArc.target{stroke:var(--orange)}.angleLabel{font-size:18px;font-weight:800}.angleLabel.known{fill:var(--blue)}.angleLabel.target{fill:var(--orange)}.circle{fill:none;stroke:#e2e7ed;stroke-width:2.5}.radius{stroke-width:6}.radius.known{stroke:var(--blue)}.radius.target{stroke:var(--orange)}.center{fill:#aab4c0}.valueBg{fill:rgba(255,255,255,.95);stroke-width:1.5}.valueBg.known{stroke:var(--blue)}.valueBg.target{stroke:var(--orange)}.figureNote{font-size:12px;color:var(--muted)}.statusNote{border-left:5px solid #91a4b8;background:#f3f6f9;padding:9px 11px;border-radius:8px;margin-top:9px;font-size:13px}.theoryControls{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted)}.theories{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.theory{border:2px solid var(--line);background:#fff;border-radius:9px;padding:10px;font-weight:800;cursor:pointer}.theory.active{border-color:#7656b5;background:#f1ecfb}.formulaBox{border:1px solid var(--line);border-radius:11px;background:#fbfcfe;padding:14px;min-height:235px}.formulaLine{text-align:center;font-size:20px;margin:11px 0;overflow-x:auto}.note{border-left:5px solid #91a4b8;background:#f2f5f8;border-radius:8px;padding:10px 12px;margin-top:10px}.good{border-color:var(--green);background:var(--greenSoft);color:#235e38}.warn{border-color:#d39c16;background:var(--yellowSoft);color:#684600}.numericEntry{margin-top:13px;display:flex;justify-content:center}.numericPanel h3{margin:0 0 5px}.formulaRef{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:11px}.formulaRef button{width:100%;border:0;background:transparent;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}.choicesGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choiceBox{border:1px solid var(--line);border-radius:9px;padding:9px;background:#f8fafc}.choiceBox h4{text-align:center;margin:0 0 7px}.choiceBtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.choiceBtn{border:1px solid #b9c5d0;background:#fff;border-radius:7px;padding:6px 8px;font-weight:800;cursor:pointer}.choiceBtn.active{border-color:var(--blue);background:var(--blueSoft);color:var(--blue)}.numericActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.footer{display:flex;justify-content:center;padding:18px}.katex{font-size:1em}

<body>
<header><h1>条件をつないで、使う定理を見つけよう</h1></header>
<main>
<section class="panel top"><button class="fold" id="howBtn"><span>使い方</span><span id="howMark">－</span></button><div class="howto" id="how"><ol><li>文字の3パーツを選ぶ</li><li>求めるものを決める</li><li>使えそうな定理を選ぶ</li><li>定理を選び、公式との対応を確認する</li><li>必要なら数値を設定する</li></ol></div></section>
<p class="guide" id="guide">「3パーツを選ぶ」を押して、活動を始めましょう。</p>
<div class="toolbar"><button class="btn primary" id="drawBtn">3パーツを選ぶ</button></div>
<section class="panel cardsPanel"><div class="cardsHead"><h2>3パーツと求めるもの</h2><div class="legend" id="legend"></div></div><div class="cards" id="cards"></div><div class="resetRole"><button class="btn hidden" id="resetTarget">求めるものを決め直す</button></div></section>
<section class="workspace">
<section class="panel figure"><h2>図で位置関係を確認</h2><div class="svgWrap"><svg viewBox="0 0 720 720" aria-label="三角形ABC"><g id="circleL"></g><g id="edgeL"></g><g id="angleL"></g><g id="pointL"></g><g id="labelL"></g></svg></div><p class="figureNote">数値設定前は位置関係を確認する模式図です。数値設定中は、条件から形が一意に決まる場合だけ比率を正確に描画します。</p><div class="statusNote hidden" id="figureStatus"></div></section>
<section class="panel right" id="right"><div id="analysisView"><h2>使う定理・公式・性質</h2><div class="theoryControls"><button class="btn" id="openTheories" disabled>使う定理を選ぶ</button></div><p class="hint" id="theoryHint">先に、求めるものを決めましょう。</p><div class="theories hidden" id="theoryList"></div><div class="formulaBox"><strong>公式との対応</strong><div id="formulaPlaceholder" class="hint" style="padding:30px;text-align:center">定理を選ぶと、ここに公式が表示されます。</div><div id="formulaContent"></div></div></div><div id="numericView" class="numericPanel hidden"></div></section>
</section>
<div class="footer"><button class="btn" id="resetAll">最初から</button></div>
</main>
<script src="./lib/katex/katex.min.js"></script>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',BLUE='#2563a6',ORANGE='#e97624',FADE='#cbd3dd';
const PARTS=[{id:'A',kind:'angle',cat:'angle',tex:'\\angle A',plain:'∠A'},{id:'B',kind:'angle',cat:'angle',tex:'\\angle B',plain:'∠B'},{id:'C',kind:'angle',cat:'angle',tex:'\\angle C',plain:'∠C'},{id:'AB',kind:'side',cat:'side',tex:'AB',plain:'AB'},{id:'BC',kind:'side',cat:'side',tex:'BC',plain:'BC'},{id:'CA',kind:'side',cat:'side',tex:'CA',plain:'CA'},{id:'R',kind:'radius',cat:'radius',tex:'R',plain:'外接円の半径 R'}];
const ANGLES=[30,45,60,90,120,135,150].map(x=>({key:String(x),n:x,tex:x+'^\\circ'}));
const SIDES=[2,3,4,5,6,8,10].map(x=>({key:String(x),n:x,tex:String(x)})).concat([{key:'sqrt2',n:Math.sqrt(2),tex:'\\sqrt{2}'},{key:'sqrt3',n:Math.sqrt(3),tex:'\\sqrt{3}'},{key:'2sqrt2',n:2*Math.sqrt(2),tex:'2\\sqrt{2}'},{key:'2sqrt3',n:2*Math.sqrt(3),tex:'2\\sqrt{3}'}]);
const THEORIES=[['sine','正弦定理'],['cosine','余弦定理'],['pyth','三平方の定理'],['sum','三角形の内角の和'],['trig','三角比']];
const DEFAULT={A:{x:360,y:125},B:{x:150,y:555},C:{x:590,y:525}};let P=clonePts(DEFAULT),anim=null;
let S={cards:[],target:null,targetMode:null,added:null,theory:null,theoriesOpen:false,formula:false,numeric:false,values:{},committed:{},startPts:null,lastValidPts:null,unique:false};
const $=id=>document.getElementById(id),layers={circle:$('circleL'),edge:$('edgeL'),angle:$('angleL'),point:$('pointL'),label:$('labelL')};
function clonePts(p){return{A:{...p.A},B:{...p.B},C:{...p.C}}}function choice(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function km(el,tex,display=false){el.textContent='';if(window.katex){try{katex.render(tex,el,{displayMode:display,throwOnError:false,trust:true,strict:'ignore'});return}catch(e){}}el.textContent=svgMath(tex)}function svgMath(tex){return String(tex).replace(/\\angle\s*/g,'∠').replace(/\\sqrt\{([^}]+)\}/g,'√$1').replace(/\^\\circ/g,'°').replace(/\\cdot/g,'·').replace(/[{}]/g,'')}
function role(id){return id===S.target?'target':S.cards.some(c=>c.id===id)?'known':'other'}function active(){return S.added?[...S.cards,S.added]:S.cards}
function resetProgress(){S.target=null;S.targetMode=null;S.added=null;S.theory=null;S.theoriesOpen=false;S.formula=false;S.numeric=false;S.values={};S.committed={};S.unique=false;P=clonePts(DEFAULT)}
function draw(){S.cards=shuffle(PARTS).slice(0,3).map(x=>({...x}));resetProgress();$('drawBtn').textContent='3パーツを選び直す';$('how').classList.add('hidden');$('howMark').textContent='＋';render()}
function setTarget(id){S.target=id;S.targetMode='initial';S.added=null;S.theory=null;S.formula=false;S.values={};S.committed={};S.unique=false;P=clonePts(DEFAULT);render()}
function redraw(i){let cur=S.cards[i],used=S.cards.filter((_,j)=>j!==i).map(x=>x.id),cand=PARTS.filter(x=>x.cat===cur.cat&&!used.includes(x.id)&&x.id!==cur.id);S.cards[i]={...(cand.length?choice(cand):cur)};resetProgress();render()}
function openTargetPicker(){let used=S.cards.map(x=>x.id),items=PARTS.filter(x=>!used.includes(x.id));let host=document.createElement('div');host.className='choicesGrid';items.forEach(x=>{let b=document.createElement('button');b.className='btn';km(b,x.tex);b.onclick=()=>{S.target=x.id;S.targetMode='added';S.added={...x};S.theory=null;S.formula=false;S.values={};S.committed={};S.unique=false;P=clonePts(DEFAULT);$('numericView').classList.add('hidden');$('analysisView').classList.remove('hidden');render()};host.appendChild(b)});$('numericView').classList.remove('hidden');$('analysisView').classList.add('hidden');$('numericView').innerHTML='<h3>求めるパーツを選択</h3><p>最初の3枚に含まれていないパーツから選びます。</p>';$('numericView').appendChild(host);let cancel=document.createElement('button');cancel.className='btn';cancel.textContent='キャンセル';cancel.onclick=()=>{S.numeric=false;$('numericView').classList.add('hidden');$('analysisView').classList.remove('hidden')};$('numericView').appendChild(cancel)}
function resetTarget(){S.target=null;S.targetMode=null;S.added=null;S.theory=null;S.theoriesOpen=false;S.formula=false;S.values={};S.committed={};S.unique=false;P=clonePts(DEFAULT);render()}
function cardTex(c){let v=S.numeric?S.values[c.id]:S.committed[c.id];return c.tex+(v?'='+v.tex:'')}
function renderCards(){let h=$('cards');h.textContent='';for(let i=0;i<3;i++){let c=S.cards[i],d=document.createElement('article');d.className='card '+role(c.id);let r=document.createElement('div');r.className='role';r.textContent=S.targetMode?(S.target===c.id?'求めるもの':'分かっているもの'):'最初に選ばれたパーツ';d.appendChild(r);let m=document.createElement('div');m.className='math';km(m,cardTex(c));d.appendChild(m);let a=document.createElement('div');a.className='actions';let t=document.createElement('button');t.textContent=S.target===c.id?'求めるもの':'求めるものにする';t.disabled=S.targetMode==='added';t.onclick=()=>setTarget(c.id);a.appendChild(t);let rr=document.createElement('button');rr.textContent='同じ種類で引き直す';rr.onclick=()=>redraw(i);a.appendChild(rr);d.appendChild(a);h.appendChild(d)}let f=document.createElement('article');f.className='card slot';if(!S.cards.length){f.classList.add('disabled');f.innerHTML='<div class="role">求めるもの専用</div><div class="math">＋</div>'}else if(S.targetMode==='initial'){f.classList.add('disabled');f.innerHTML='<div class="role">今回は使用しません</div><div class="math">追加なし</div>'}else if(S.added){f.classList.add('target');f.innerHTML='<div class="role">求めるもの</div><div class="math" id="addedMath"></div><div class="actions"><button id="changeAdded">求めるパーツを変更</button></div>';km(f.querySelector('#addedMath'),S.added.tex);f.querySelector('#changeAdded').onclick=openTargetPicker}else{f.innerHTML='<div class="role">求めるもの専用</div><div class="math">＋</div><div class="actions"><button id="addTarget">求めるパーツを追加</button></div>';f.querySelector('#addTarget').onclick=openTargetPicker}h.appendChild(f);$('resetTarget').classList.toggle('hidden',!S.targetMode)}
function renderLegend(){let l=$('legend');if(!S.cards.length){l.innerHTML='';return}l.innerHTML=S.targetMode?'<span><i class="dot" style="background:var(--blue)"></i>青：分かっているもの</span><span><i class="dot" style="background:var(--orange)"></i>オレンジ：求めるもの</span>':'<span><i class="dot" style="background:var(--blue)"></i>青：最初の3パーツ</span><span><i class="dot" style="background:#f4c7a5"></i>薄いオレンジ：追加できる求めるもの</span>'}
function el(tag,attrs,parent){let n=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));parent.appendChild(n);return n}function txt(x,y,s,cls,parent){let n=el('text',{x,y,class:cls,'text-anchor':'middle','dominant-baseline':'middle'},parent);n.textContent=s;return n}function clear(){Object.values(layers).forEach(x=>x.textContent='')}
function circum(A,B,C){let d=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y)),ux=((A.x*A.x+A.y*A.y)*(B.y-C.y)+(B.x*B.x+B.y*B.y)*(C.y-A.y)+(C.x*C.x+C.y*C.y)*(A.y-B.y))/d,uy=((A.x*A.x+A.y*A.y)*(C.x-B.x)+(B.x*B.x+B.y*B.y)*(A.x-C.x)+(C.x*C.x+C.y*C.y)*(B.x-A.x))/d;return{x:ux,y:uy,r:Math.hypot(A.x-ux,A.y-uy)}}
function linePos(a,b,t){let mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;if((t.x-mx)*nx+(t.y-my)*ny>0){nx=-nx;ny=-ny}return{x:mx+nx*34,y:my+ny*34}}
function angleInfo(k){let V=P[k],o=k==='A'?[P.B,P.C]:k==='B'?[P.A,P.C]:[P.A,P.B],a1=Math.atan2(o[0].y-V.y,o[0].x-V.x),a2=Math.atan2(o[1].y-V.y,o[1].x-V.x),d=(a2-a1+Math.PI*2)%(Math.PI*2);if(d>Math.PI){[a1,a2]=[a2,a1];d=Math.PI*2-d}return{V,s:a1,e:a1+d,d}}
function arc(V,r,s,e){let p={x:V.x+r*Math.cos(s),y:V.y+r*Math.sin(s)},q={x:V.x+r*Math.cos(e),y:V.y+r*Math.sin(e)};return`M ${p.x} ${p.y} A ${r} ${r} 0 0 1 ${q.x} ${q.y}`}
function valueText(id){let base=svgMath(PARTS.find(x=>x.id===id).tex);if(S.numeric){if(id===S.target)return base+'=?';let v=S.values[id];if(v)return base+'='+svgMath(v.tex)}if(S.committed[id])return base+'='+svgMath(S.committed[id].tex);return base}
function svgLabel(x,y,text,rl){let w=Math.max(46,text.length*9+18),r=el('rect',{x:x-w/2,y:y-15,width:w,height:30,rx:7,class:'valueBg '+rl},layers.label);txt(x,y,text,(rl==='known'?'edgeLabel known':'edgeLabel target'),layers.label)}
function renderDiagram(){clear();let hasR=active().some(x=>x.id==='R');if(hasR){let c=circum(P.A,P.B,P.C);el('circle',{cx:c.x,cy:c.y,r:c.r,class:'circle'},layers.circle);let ro=role('R');el('line',{x1:c.x,y1:c.y,x2:P.A.x,y2:P.A.y,class:'radius '+ro},layers.circle);el('circle',{cx:c.x,cy:c.y,r:6,class:'center'},layers.circle);txt(c.x+15,c.y+15,'O','vertexLabel',layers.label);let tx=(c.x+P.A.x)/2+18,ty=(c.y+P.A.y)/2;S.numeric||S.committed.R?svgLabel(tx,ty,valueText('R'),ro):txt(tx,ty,'R','edgeLabel '+ro,layers.label)}let E=[['AB',P.A,P.B,P.C],['BC',P.B,P.C,P.A],['CA',P.C,P.A,P.B]];E.forEach(([id,a,b,t])=>{let ro=role(id);el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge '+ro},layers.edge);let q=linePos(a,b,t);if((S.numeric&&(S.values[id]||id===S.target))||S.committed[id])svgLabel(q.x,q.y,valueText(id),ro);else txt(q.x,q.y,id,'edgeLabel '+ro,layers.label)});['A','B','C'].forEach(id=>{let ro=role(id);if(ro!=='other'){let a=angleInfo(id);el('path',{d:arc(a.V,52,a.s,a.e),class:'angleArc '+ro},layers.angle);let m=a.s+a.d/2,x=a.V.x+83*Math.cos(m),y=a.V.y+83*Math.sin(m);if((S.numeric&&(S.values[id]||id===S.target))||S.committed[id])svgLabel(x,y,valueText(id),ro);else txt(x,y,'∠'+id,'angleLabel '+ro,layers.label)}});let cen={x:(P.A.x+P.B.x+P.C.x)/3,y:(P.A.y+P.B.y+P.C.y)/3};['A','B','C'].forEach(id=>{el('circle',{cx:P[id].x,cy:P[id].y,r:10,class:'vertex'},layers.point);let dx=P[id].x-cen.x,dy=P[id].y-cen.y,L=Math.hypot(dx,dy);txt(P[id].x+dx/L*30,P[id].y+dy/L*30,id,'vertexLabel',layers.label)})}
function theoryParts(id){return id==='sine'?['A','B','C','AB','BC','CA','R']:id==='cosine'?['A','B','C','AB','BC','CA']:id==='pyth'?['AB','BC','CA']:id==='sum'?['A','B','C']:[]}
function color(id,t){return`\\textcolor{${role(id)==='known'?BLUE:role(id)==='target'?ORANGE:FADE}}{${t}}`}function addFormula(host,t){let d=document.createElement('div');d.className='formulaLine';km(d,t,true);host.appendChild(d)}function addNote(h,title,msg,cls='note'){let d=document.createElement('div');d.className=cls;d.innerHTML='<strong>'+title+'</strong><br>'+msg;h.appendChild(d)}
function formulaHTML(host){let A=color('A','A'),B=color('B','B'),C=color('C','C'),AB=color('AB','AB'),BC=color('BC','BC'),CA=color('CA','CA'),R=color('R','R');if(S.theory==='sine'){addFormula(host,`\\frac{${BC}}{\\sin ${A}}=\\frac{${CA}}{\\sin ${B}}=\\frac{${AB}}{\\sin ${C}}=2${R}`);addNote(host,'式の対応を見よう','辺とその対角、外接円の半径との対応を確認しましょう。')}else if(S.theory==='cosine'){addFormula(host,`${BC}^2=${CA}^2+${AB}^2-2\\cdot${CA}\\cdot${AB}\\cos${A}`);addFormula(host,`${CA}^2=${AB}^2+${BC}^2-2\\cdot${AB}\\cdot${BC}\\cos${B}`);addFormula(host,`${AB}^2=${BC}^2+${CA}^2-2\\cdot${BC}\\cdot${CA}\\cos${C}`)}else if(S.theory==='pyth'){addFormula(host,`${BC}^2=${CA}^2+${AB}^2`);addFormula(host,`${CA}^2=${AB}^2+${BC}^2`);addFormula(host,`${AB}^2=${BC}^2+${CA}^2`);addNote(host,'適用条件','直角三角形であることと、斜辺を確認しましょう。','note warn')}else if(S.theory==='sum'){addFormula(host,`${A}+${B}+${C}=180^\\circ`)}else{addFormula(host,'\\sin\\theta=\\frac{\\text{対辺}}{\\text{斜辺}}');addFormula(host,'\\cos\\theta=\\frac{\\text{隣辺}}{\\text{斜辺}}');addFormula(host,'\\tan\\theta=\\frac{\\text{対辺}}{\\text{隣辺}}');addNote(host,'適用条件','直角三角形と着目する角を決める必要があります。','note warn')}if(S.theory!=='trig'){let missing=active().filter(x=>!theoryParts(S.theory).includes(x.id));addNote(host,'対応を確認しよう',missing.length?'この公式には「'+missing.map(x=>x.plain).join('、')+'」が直接現れていません。':'分かっているものと求めるものは、すべてこの公式に現れています。',missing.length?'note warn':'note good')}}
function renderTheory(){let ready=!!S.target;$('openTheories').disabled=!ready;$('theoryList').classList.toggle('hidden',!S.theoriesOpen);let l=$('theoryList');l.textContent='';THEORIES.forEach(([id,n])=>{let b=document.createElement('button');b.className='theory '+(S.theory===id?'active':'');b.textContent=n;b.onclick=()=>{S.theory=id;S.formula=true;render()};l.appendChild(b)});let ph=$('formulaPlaceholder'),fc=$('formulaContent');ph.classList.toggle('hidden',S.formula);fc.textContent='';if(S.formula){formulaHTML(fc);let d=document.createElement('div');d.className='numericEntry';let b=document.createElement('button');b.className='btn primary';b.textContent=Object.keys(S.committed).length?'数値を設定し直す':'数値を設定';b.onclick=startNumeric;d.appendChild(b);fc.appendChild(d)}$('theoryHint').textContent=!ready?'先に、求めるものを決めましょう。':!S.theoriesOpen?'分かっているものと求めるものをつなぐ定理を考えましょう。':!S.theory?'最も直接的なものを選びましょう。':'公式を思い出してから確認しましょう。'}
function known(){return S.cards.filter(x=>x.id!==S.target)}function validate(){let k=known();if(k.some(x=>!S.values[x.id]))return{ok:false,complete:false,title:'数値を選ぼう',msg:'分かっているものすべてについて数値を選んでください。',unique:false};let av=k.filter(x=>x.kind==='angle').map(x=>S.values[x.id].n),sum=av.reduce((a,b)=>a+b,0);if(av.length===3&&Math.abs(sum-180)>.001)return{ok:false,complete:true,title:'三角形が成立しません',msg:'3つの内角の和を180°にしてください。',unique:false};if(av.length<3&&sum>=180)return{ok:false,complete:true,title:'三角形が成立しません',msg:'分かっている角の和は180°未満である必要があります。',unique:false};if(['AB','BC','CA'].every(x=>S.values[x])){let a=S.values.AB.n,b=S.values.BC.n,c=S.values.CA.n;if(!(a+b>c&&b+c>a&&c+a>b))return{ok:false,complete:true,title:'三角形が成立しません',msg:'どの2辺の和も、残りの1辺より大きくなる必要があります。',unique:false}}let tri=triangleFromValues();return{ok:true,complete:true,title:tri?'形が一意に決まりました':'数値は反映できます',msg:tri?'図を選択した値の比率に合わせて表示しています。':'この条件だけでは三角形全体の形は一意に決まらないため、図は現在の模式図を維持します。',unique:!!tri,tri}}
function triangleFromValues(){let v=S.values;if(v.AB&&v.BC&&v.CA)return{AB:v.AB.n,BC:v.BC.n,CA:v.CA.n};let cases=[['AB','CA','A','BC'],['AB','BC','B','CA'],['BC','CA','C','AB']];for(let [s1,s2,a,o] of cases)if(v[s1]&&v[s2]&&v[a]){let x=v[s1].n,y=v[s2].n,t=v[a].n*Math.PI/180,z=Math.sqrt(x*x+y*y-2*x*y*Math.cos(t)),r={};r[s1]=x;r[s2]=y;r[o]=z;return r}let aa=['A','B','C'].filter(x=>v[x]),side=['AB','BC','CA'].find(x=>v[x]);if(aa.length>=2&&side){let q={};aa.forEach(x=>q[x]=v[x].n);let miss=['A','B','C'].find(x=>q[x]==null);q[miss]=180-Object.values(q).reduce((a,b)=>a+b,0);if(q[miss]<=0)return null;let opp={AB:'C',BC:'A',CA:'B'},base=v[side].n/Math.sin(q[opp[side]]*Math.PI/180);return{AB:base*Math.sin(q.C*Math.PI/180),BC:base*Math.sin(q.A*Math.PI/180),CA:base*Math.sin(q.B*Math.PI/180)}}return null}
function pointsFromTri(t){let a=t.BC,b=t.CA,c=t.AB,x=(a*a+c*c-b*b)/(2*a),y=Math.sqrt(Math.max(.0001,c*c-x*x)),min=Math.min(0,x),max=Math.max(a,x),w=max-min||1,h=y||1,scale=Math.min(430/w,390/h),ox=360-(min+max)*scale/2,base=560;return{B:{x:ox,y:base},C:{x:ox+a*scale,y:base},A:{x:ox+x*scale,y:base-y*scale}}}
function animateTo(target,done){if(anim)cancelAnimationFrame(anim);let st=performance.now(),from=clonePts(P);function step(now){let u=Math.min(1,(now-st)/400),e=1-Math.pow(1-u,3);['A','B','C'].forEach(k=>{P[k].x=from[k].x+(target[k].x-from[k].x)*e;P[k].y=from[k].y+(target[k].y-from[k].y)*e});renderDiagram();if(u<1)anim=requestAnimationFrame(step);else{anim=null;if(done)done()}}anim=requestAnimationFrame(step)}
function selectValue(id,v){S.values[id]=v;renderCards();let res=validate();if(res.ok&&res.unique){let pts=pointsFromTri(res.tri);S.lastValidPts=clonePts(pts);animateTo(pts)}renderNumericStatus(res);renderDiagram()}
function startNumeric(){S.numeric=true;S.values={...S.committed};S.startPts=clonePts(P);S.lastValidPts=clonePts(P);$('analysisView').classList.add('hidden');$('numericView').classList.remove('hidden');renderNumeric();renderCards();renderDiagram()}
function renderNumeric(){let h=$('numericView');h.textContent='';let title=document.createElement('h3');title.textContent='数値を設定';h.appendChild(title);let ref=document.createElement('div');ref.className='formulaRef';ref.innerHTML='<button><span>選んだ公式を確認</span><span>＋</span></button><div class="hidden" id="formulaRefBody"></div>';ref.querySelector('button').onclick=()=>{let b=ref.querySelector('#formulaRefBody');b.classList.toggle('hidden');ref.querySelector('button span:last-child').textContent=b.classList.contains('hidden')?'＋':'－'};h.appendChild(ref);formulaHTML(ref.querySelector('#formulaRefBody'));let grid=document.createElement('div');grid.className='choicesGrid';known().forEach(c=>{let box=document.createElement('div');box.className='choiceBox';let hh=document.createElement('h4');km(hh,c.tex);box.appendChild(hh);let set=document.createElement('div');set.className='choiceBtns';(c.kind==='angle'?ANGLES:SIDES).forEach(v=>{let b=document.createElement('button');b.className='choiceBtn '+(S.values[c.id]&&S.values[c.id].key===v.key?'active':'');km(b,v.tex);b.onclick=()=>{selectValue(c.id,v);renderNumeric()};set.appendChild(b)});box.appendChild(set);grid.appendChild(box)});h.appendChild(grid);let status=document.createElement('div');status.id='numericStatus';h.appendChild(status);let acts=document.createElement('div');acts.className='numericActions';let ok=document.createElement('button');ok.className='btn primary';ok.id='commitNumbers';ok.textContent='選んだ数値を反映';ok.onclick=commitNumeric;let cancel=document.createElement('button');cancel.className='btn';cancel.textContent='キャンセル';cancel.onclick=cancelNumeric;acts.append(ok,cancel);h.appendChild(acts);renderNumericStatus(validate())}
function renderNumericStatus(r){let b=$('numericStatus');if(!b)return;b.className='note '+(r.ok?'good':'warn');b.innerHTML='<strong>'+r.title+'</strong><br>'+r.msg;let ok=$('commitNumbers');if(ok)ok.disabled=!r.ok||!r.complete;$('figureStatus').classList.toggle('hidden',r.unique||!r.complete);if(!r.unique&&r.complete){$('figureStatus').textContent='設定した条件だけでは三角形全体の形は一意に決まらないため、図は模式図で表示しています。'}}
function commitNumeric(){let r=validate();if(!r.ok)return;S.committed={...S.values};S.numeric=false;S.unique=r.unique;if(r.unique)P=clonePts(pointsFromTri(r.tri));$('numericView').classList.add('hidden');$('analysisView').classList.remove('hidden');render()}
function cancelNumeric(){S.numeric=false;S.values={...S.committed};$('numericView').classList.add('hidden');$('analysisView').classList.remove('hidden');animateTo(S.startPts,render);renderCards();$('figureStatus').classList.add('hidden')}
function renderGuide(){let g=$('guide');g.textContent=!S.cards.length?'「3パーツを選ぶ」を押して、活動を始めましょう。':!S.targetMode?'3枚の中から求めるものを選ぶか、右のカードに新しい求めるものを追加しましょう。':S.numeric?'左の図を見ながら数値を選びましょう。条件がそろうと三角形が滑らかに変形します。':!S.theoriesOpen?'分かっているものと求めるものをつなぐ定理を考えましょう。':!S.theory?'最も直接的に使えそうなものを選びましょう。':!S.formula?'公式を自分で思い出してから確認しましょう。':'公式との対応を確認し、必要なら数値を設定しましょう。'}
function render(){renderCards();renderLegend();renderDiagram();renderTheory();renderGuide();$('figureStatus').classList.toggle('hidden',S.unique||!Object.keys(S.committed).length);if(!S.unique&&Object.keys(S.committed).length)$('figureStatus').textContent='設定した条件だけでは三角形全体の形は一意に決まらないため、図は模式図で表示しています。'}
$('drawBtn').onclick=draw;$('resetTarget').onclick=resetTarget;$('openTheories').onclick=()=>{S.theoriesOpen=true;render()};$('resetAll').onclick=()=>{S={cards:[],target:null,targetMode:null,added:null,theory:null,theoriesOpen:false,formula:false,numeric:false,values:{},committed:{},unique:false};P=clonePts(DEFAULT);$('drawBtn').textContent='3パーツを選ぶ';$('analysisView').classList.remove('hidden');$('numericView').classList.add('hidden');render();scrollTo({top:0,behavior:'smooth'})};$('howBtn').onclick=()=>{$('how').classList.toggle('hidden');$('howMark').textContent=$('how').classList.contains('hidden')?'＋':'－'};render();
})();
</script>
