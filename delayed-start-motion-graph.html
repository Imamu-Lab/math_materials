<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4分後に出発する兄のグラフ</title>
<style>
:root{--blue:#1878c8;--red:#e44747;--green:#2c9b68;--ink:#243447;--grid:#b9d8ec}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}main{max-width:1200px;margin:auto;padding:18px}.box{background:#fff;border-radius:18px;padding:16px 20px;box-shadow:0 5px 18px #2342}h1{margin:0 0 8px;font-size:clamp(24px,3vw,36px)}.problem{font-size:clamp(16px,1.7vw,20px);line-height:1.7;margin:0}.settings{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-top:14px}.setting{background:#eef7fc;border-radius:12px;padding:9px}.setting label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}.setting input{width:100%;font-size:18px;font-weight:800;padding:7px;border:2px solid #9fc9e3;border-radius:8px}.setting small{display:block;margin-top:3px;color:#586777}@media(max-width:760px){.settings{grid-template-columns:1fr 1fr}}.layout{display:grid;grid-template-columns:minmax(350px,.92fr) minmax(500px,1.25fr);gap:18px;margin-top:18px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 18px #2342}.card h2{font-size:21px;margin:0 0 10px}.roadWrap{position:relative;height:280px;border-radius:14px;overflow:hidden;background:linear-gradient(#cceeff 0 52%,#c7e89b 52% 67%,#73777a 67% 90%,#bbb 90%)}.road{position:absolute;left:6%;right:6%;top:74%;height:4px;background:#eee}.scale{position:absolute;inset:0}.scale span{position:absolute;top:79%;transform:translateX(-50%);font-size:12px;font-weight:800;color:#fff;background:#243447d9;padding:2px 4px;border-radius:5px}.scale span:before{content:"";position:absolute;left:50%;bottom:100%;height:12px;border-left:2px solid #fff}.home,.goal{position:absolute;top:43%;font-size:42px;transform:translateX(-50%)}.home{left:7%}.goal{left:93%}.clock{position:absolute;right:12px;top:10px;background:#fff;padding:7px 12px;border-radius:20px;font-weight:800;font-size:18px;box-shadow:0 2px 8px #2344}.walker{position:absolute;top:56%;transform:translateX(-50%);text-align:center;z-index:3}.person{display:block;position:relative;margin:0 auto 3px;width:30px;height:48px;transform-origin:50% 90%}.person .head{position:absolute;left:9px;top:1px;width:15px;height:15px;border-radius:50%;background:#ffd3a3;border:2px solid #243447}.person .body{position:absolute;left:10px;top:16px;width:14px;height:21px;border-radius:5px;border:2px solid #243447}.person .arm{position:absolute;left:20px;top:19px;width:14px;height:5px;border-radius:4px;background:#ffd3a3;border:2px solid #243447;transform:rotate(-18deg);transform-origin:left center}.person .leg{position:absolute;top:35px;width:5px;height:14px;border-radius:4px;background:#33435b;transform-origin:top center}.person .leg1{left:11px;transform:rotate(18deg)}.person .leg2{left:20px;transform:rotate(-18deg)}.person-younger{width:27px;height:43px}.person-younger .head{left:7px;top:4px;width:14px;height:14px;box-shadow:0 -5px 0 -1px #1878c8}.person-younger .body{left:8px;top:18px;width:12px;height:17px;background:#4aa3df}.person-younger .arm{left:17px;top:20px}.person-younger .leg{top:33px;height:11px}.person-younger .leg1{left:9px}.person-younger .leg2{left:17px}.person-older{width:35px;height:52px}.person-older .head{left:11px;box-shadow:0 -6px 0 -1px #e44747}.person-older .body{left:10px;top:16px;width:16px;height:23px;background:#e44747}.person-older .arm{left:22px}.person-older .leg{top:37px;height:15px}.walking .person{animation:step .32s infinite alternate}.tag{position:absolute;bottom:calc(100% + 5px);white-space:nowrap;color:#fff;font-weight:800;padding:4px 9px;border-radius:12px;font-size:14px;box-shadow:0 2px 5px #2345}.younger .tag{right:10px;background:var(--blue)}.older .tag{left:10px;background:var(--red)}@keyframes step{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-3px)}}.message{min-height:78px;margin-top:10px;padding:12px;background:#eef7fc;border-radius:12px;font-size:16px;line-height:1.55;font-weight:700}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 3px 0 #0b5790}button.green{background:var(--green);box-shadow:0 3px 0 #1d6846}button.red{background:var(--red);box-shadow:0 3px 0 #a72c2c}button.gray{background:#687684;box-shadow:0 3px 0 #424b54}button:disabled{opacity:.4;cursor:not-allowed}.graphBox{width:100%;aspect-ratio:16/11;min-height:400px}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-weight:800}.key{display:inline-block;width:28px;height:4px;vertical-align:middle;margin-right:7px}.guide{margin-top:12px;padding:12px;border-radius:12px;background:#fff7dc;line-height:1.65;font-weight:700}.guide b{color:#b43b3b}.note{margin:10px 0 0;color:#586777;font-size:14px;line-height:1.6}@media(max-width:880px){.layout{grid-template-columns:1fr}.graphBox{min-height:340px}}
</style></head><body><main>
<section class="box"><h1>4分後に出発する兄のグラフ</h1><p class="problem" id="problemText"><b>問題：</b>弟が家を出発してから4分後に、兄が家を出発して弟を追いかけました。弟は分速50m、兄は分速70mで歩きます。学校までは700mです。</p><div class="settings"><div class="setting"><label for="youngerSpeed">弟の速さ（m/分）</label><input id="youngerSpeed" type="number" min="1" max="1000" value="50"><small>1～1000</small></div><div class="setting"><label for="olderSpeed">兄の速さ（m/分）</label><input id="olderSpeed" type="number" min="1" max="1000" value="70"><small>1～1000</small></div><div class="setting"><label for="delay">兄のスタート（分後）</label><input id="delay" type="number" min="0" max="60" step="0.5" value="4"><small>0～60</small></div><div class="setting"><label for="schoolDistance">学校までの距離（m）</label><input id="schoolDistance" type="number" min="100" max="3000" step="100" value="700"><small>100～3000</small></div></div><div class="controls"><button id="applySettings" class="green">設定を反映する</button></div></section>
<div class="layout"><section class="card"><h2>① 動きを見よう</h2><div class="roadWrap"><div class="road"></div><div class="scale" id="roadScale"></div><div class="home">🏠</div><div class="goal">🏫</div><div class="clock" id="clock">0分00秒</div><div class="walker younger" id="younger"><span class="person person-younger"><span class="head"></span><span class="body"></span><span class="arm"></span><span class="leg leg1"></span><span class="leg leg2"></span></span><span class="tag" id="youngerTag">弟 50m/分</span></div><div class="walker older" id="older"><span class="person person-older"><span class="head"></span><span class="body"></span><span class="arm"></span><span class="leg leg1"></span><span class="leg leg2"></span></span><span class="tag" id="olderTag">兄 70m/分</span></div></div>
<div class="message" id="message">弟が先に出発します。兄は4分間、家で待ってから出発します。</div><div class="controls"><button id="motion">▶ 実際の動きを見る</button><button class="green" id="sync">▶ 動きと完成グラフを同時に見る</button><button class="gray" id="pause" disabled>⏸ 一時停止</button><button class="gray" id="reset">↺ はじめから</button></div><p class="note">※画面では、設定に応じた移動時間を約1分＝1秒で表します。</p></section>
<section class="card"><h2>② 兄のグラフを設定した時刻まで動かそう</h2><div class="graphBox"><canvas id="graph"></canvas></div><div class="legend"><span><i class="key" style="background:#1878c8"></i>弟のグラフ</span><span><i class="key" style="background:#e44747"></i>兄のグラフ</span></div>
<div class="controls"><button id="baseOlder" class="red">1 原点から兄のグラフをかく</button><button id="shiftOlder" class="red" disabled>2 右へ<span id="shiftMinutes">4</span>分移動する</button><button id="drawYounger">弟のグラフをかく</button><button id="targetShift" class="green">兄の設定時刻スタートのグラフをかく</button><button id="clear" class="gray">グラフを消す</button></div>
<div class="guide" id="guide"><div id="dragInfo" style="margin-bottom:6px;color:#b43b3b">赤い直線をつまむと、始点が0分から右側のx軸上だけを平行移動します。</div></div></section></div>
</main><script>
const c=document.getElementById('graph'),ctx=c.getContext('2d');let W,H,dpr;const M={l:58,r:20,t:22,b:48};let youngerV=50,olderV=70,startDelay=4,schoolD=700,xmax=15,ymax=800,endTime=14;let yProg=0,oProg=0,oldShift=0,oldShiftY=0,showY=false,showO=false,mode='base',drawing=false;
function px(x){return M.l+x*(W-M.l-M.r)/xmax}function py(y){return H-M.b-y*(H-M.t-M.b)/ymax}function resize(){let r=c.getBoundingClientRect();dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);paint()}addEventListener('resize',resize);
function line(x1,y1,x2,y2,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(px(x1),py(y1));ctx.lineTo(px(x2),py(y2));ctx.stroke()}
function paint(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.lineWidth=1;ctx.strokeStyle='#cfe3f0';ctx.setLineDash([2,4]);for(let y=20;y<ymax;y+=20)if(y%100)line(0,y,xmax,y,'#cfe3f0',1);ctx.setLineDash([]);ctx.strokeStyle='#9fc9e3';for(let x=0;x<=Math.floor(xmax);x++)line(x,0,x,ymax,'#9fc9e3',1);for(let y=0;y<=ymax;y+=100)line(0,y,xmax,y,'#9fc9e3',1);line(0,0,xmax,0,'#263746',2);line(0,0,0,ymax,'#263746',2);ctx.fillStyle='#263746';ctx.font='14px sans-serif';ctx.textAlign='center';for(let x=0;x<=Math.floor(xmax);x++)ctx.fillText(x,px(x),H-23);ctx.textAlign='right';for(let y=0;y<=ymax;y+=100)ctx.fillText(y,M.l-8,py(y)+5);ctx.textAlign='left';ctx.font='bold 14px sans-serif';ctx.fillText('時間（分）',W-78,H-5);ctx.fillText('道のり（m）',7,15);
if(showY){let xe=xmax*yProg;line(0,0,xe,youngerV*xe,'#1878c8',4)}if(showO){let sx=startDelay*oldShift,sy=oldShiftY,xe=sx+xmax*oProg;ctx.save();ctx.beginPath();ctx.rect(px(0),py(ymax),px(xmax)-px(0),py(0)-py(ymax));ctx.clip();line(sx,sy,xe,sy+olderV*(xe-sx),'#e44747',5);ctx.restore();if(dragging){ctx.fillStyle='#e44747';ctx.font='bold 15px sans-serif';ctx.fillText('つまんだまま動かせます',px(5.2),py(740))}}}
function animate(prop,from,to,ms,done){if(drawing)return;drawing=true;let st=performance.now();function f(now){let q=Math.min(1,(now-st)/ms),v=from+(to-from)*q;if(prop==='o')oProg=v;if(prop==='s')oldShift=v;if(prop==='y')yProg=v;paint();if(q<1)requestAnimationFrame(f);else{drawing=false;done&&done()}}requestAnimationFrame(f)}
document.getElementById('baseOlder').onclick=()=>{showO=true;oldShift=0;oldShiftY=0;oProg=0;animate('o',0,1,1200,()=>{document.getElementById('shiftOlder').disabled=false;guide.innerHTML='毎分70mなので、まず原点から比例のグラフを書けました。ただし、実際の兄は<b>4分後に出発</b>します。次に直線全体を右へ設定した分数だけ動かします。'})};
document.getElementById('shiftOlder').onclick=()=>{showO=true;oProg=1;oldShiftY=0;animate('s',oldShift,1,1400,()=>{guide.innerHTML='直線の<b>形と傾きはそのまま</b>で、始点を0分から4分へ移しました。これで、兄が4分後に家を出て、そこから毎分70m進む様子を表せます。'})};
document.getElementById('drawYounger').onclick=()=>{showY=true;yProg=0;animate('y',0,1,1100)};document.getElementById('clear').onclick=()=>{showY=showO=false;yProg=oProg=oldShift=oldShiftY=0;document.getElementById('shiftOlder').disabled=true;paint()};

let dragging=false,dragDX=0,dragDY=0;
function canvasPoint(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function graphPoint(p){return{x:(p.x-M.l)*xmax/(W-M.l-M.r),y:(H-M.b-p.y)*ymax/(H-M.t-M.b)}}
function distanceToOlder(g){let sx=startDelay*oldShift,sy=oldShiftY;return Math.abs(olderV*g.x-g.y+(sy-olderV*sx))/Math.sqrt(olderV*olderV+1)}
c.addEventListener('pointerdown',e=>{if(!showO)return;let p=canvasPoint(e),g=graphPoint(p);if(g.x<0||g.x>xmax||g.y<0||g.y>ymax||distanceToOlder(g)>28)return;dragging=true;c.classList.add('dragging');c.setPointerCapture(e.pointerId);dragDX=g.x-startDelay*oldShift;dragDY=0;e.preventDefault()});
c.addEventListener('pointermove',e=>{if(!dragging)return;let g=graphPoint(canvasPoint(e));let sx=Math.max(0,Math.min(xmax,g.x-dragDX));let sy=0;oldShift=startDelay? sx/startDelay : 0;oldShiftY=0;oProg=1;paint();dragInfo.textContent='移動後の始点：時間 '+sx.toFixed(1)+'分、道のり 0m';e.preventDefault()});
function endDrag(e){if(!dragging)return;dragging=false;c.classList.remove('dragging');try{c.releasePointerCapture(e.pointerId)}catch(_){ }paint()}
c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);
document.getElementById('targetShift').onclick=()=>{if(drawing)return;showO=true;oldShift=1;oldShiftY=0;oProg=0;dragInfo.textContent='兄のグラフをかいています。始点：時間 '+startDelay.toFixed(1)+'分、道のり 0m';animate('o',0,1,1100,()=>{dragInfo.textContent='兄のグラフをかきました。始点：時間 '+startDelay.toFixed(1)+'分、道のり 0m';guide.lastChild.textContent=' 兄は設定した時刻に家を出発し、そこから毎分'+olderV+'m進みます。'})};
const younger=document.getElementById('younger'),older=document.getElementById('older'),clock=document.getElementById('clock'),msg=document.getElementById('message');let t=0,run=false,last=0,syncMode=false;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function buildRoadScale(){roadScale.innerHTML='';let step=schoolD<=1000?100:schoolD<=2000?200:500;for(let d=0;d<=schoolD;d+=step){let sp=document.createElement('span');sp.textContent=d+'m';sp.style.left=(7+86*d/schoolD)+'%';roadScale.appendChild(sp)}if(schoolD%step){let sp=document.createElement('span');sp.textContent=schoolD+'m';sp.style.left='93%';roadScale.appendChild(sp)}}
function applySettings(){youngerV=clamp(Number(youngerSpeed.value)||50,1,1000);olderV=clamp(Number(olderSpeed.value)||70,1,1000);startDelay=clamp(Number(delay.value)||0,0,60);schoolD=clamp(Number(schoolDistance.value)||700,100,3000);youngerSpeed.value=youngerV;olderSpeed.value=olderV;delay.value=startDelay;schoolDistance.value=schoolD;document.getElementById('shiftMinutes').textContent=Number.isInteger(startDelay)?String(startDelay):startDelay.toFixed(1);let ty=schoolD/youngerV,to=startDelay+schoolD/olderV;let meetT=olderV>youngerV?olderV*startDelay/(olderV-youngerV):NaN;let meetD=Number.isFinite(meetT)?youngerV*meetT:NaN;endTime=Math.max(ty,to,Number.isFinite(meetT)?meetT:0);xmax=Math.max(5,Math.ceil(endTime+1));let topD=Math.max(schoolD,Number.isFinite(meetD)?meetD:0);ymax=Math.max(200,(Math.floor(topD/100)+1)*100);youngerTag.textContent='弟 '+youngerV+'m/分';olderTag.textContent='兄 '+olderV+'m/分';problemText.innerHTML='<b>問題：</b>弟が家を出発してから'+startDelay+'分後に、兄が家を出発して弟を追いかけました。弟は分速'+youngerV+'m、兄は分速'+olderV+'mで歩きます。学校までは'+schoolD+'mです。';buildRoadScale();run=false;t=0;last=0;syncMode=false;showY=showO=false;yProg=oProg=oldShift=oldShiftY=0;document.getElementById('shiftOlder').disabled=true;msg.textContent='弟が先に出発します。兄は'+startDelay+'分間、家で待ってから出発します。';place();paint()}
document.getElementById('applySettings').onclick=applySettings;
document.getElementById('delay').addEventListener('input',()=>{let v=clamp(Number(delay.value)||0,0,60);document.getElementById('shiftMinutes').textContent=Number.isInteger(v)?String(v):v.toFixed(1)});

function place(){let yd=Math.min(schoolD,youngerV*t),od=t<startDelay?0:Math.min(schoolD,olderV*(t-startDelay));younger.style.left=(7+86*yd/schoolD)+'%';older.style.left=(7+86*od/schoolD)+'%';older.style.opacity=t<startDelay?'.55':'1';clock.textContent=Math.floor(t)+'分'+String(Math.floor((t%1)*60)).padStart(2,'0')+'秒';if(syncMode){showY=true;showO=t>=startDelay;oldShift=1;oldShiftY=0;yProg=Math.min(1,t/xmax);oProg=t<startDelay?0:Math.min(1,(t-startDelay)/xmax);paint()}if(t<startDelay)msg.innerHTML='弟が歩いています。兄は家で待っています。兄の出発まであと<b>'+Math.max(0,startDelay-t).toFixed(1)+'分</b>です。';else if(t<endTime)msg.innerHTML=startDelay+'分後、兄が出発しました。弟は分速'+youngerV+'m、兄は分速'+olderV+'mで進んでいます。';else msg.innerHTML='<b>アニメーションが終了しました。弟と兄の学校到着時刻をグラフで確かめましょう。</b>'}
function loop(now){if(!run)return;if(!last)last=now;t+=(now-last)/1000;last=now;if(t>=endTime){t=endTime;run=false;syncMode=false;younger.classList.remove('walking');older.classList.remove('walking');pause.disabled=true}place();if(run)requestAnimationFrame(loop)}
function start(sync){run=false;t=0;last=0;syncMode=sync;showY=sync;showO=false;yProg=oProg=0;oldShift=sync?1:0;oldShiftY=0;younger.classList.add('walking');older.classList.add('walking');pause.disabled=false;run=true;requestAnimationFrame(loop)}document.getElementById('motion').onclick=()=>start(false);document.getElementById('sync').onclick=()=>start(true);document.getElementById('pause').onclick=()=>{run=false;younger.classList.remove('walking');older.classList.remove('walking');pause.disabled=true};document.getElementById('reset').onclick=()=>{run=false;t=0;last=0;syncMode=false;showY=showO=false;yProg=oProg=oldShift=oldShiftY=0;younger.classList.remove('walking');older.classList.remove('walking');pause.disabled=true;msg.textContent='弟が先に出発します。兄は'+startDelay+'分間、家で待ってから出発します。';place();paint()};resize();applySettings();
</script></body></html>
